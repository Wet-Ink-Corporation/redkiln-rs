# SUPPLEMENTARY v0 pack (amendment disclosed in F35).
[pack]
id = "docs"
applies = "kind == docs"
appetite = { points = 10 }
[policy]
stages = { triage = "mandatory", discovery = "forbidden", analysis = "forbidden", specification = "optional", design = "forbidden", planning = "optional", implement = "mandatory", verify = "forbidden", review = "recommended", release = "mandatory", operate = "forbidden", closeout = "optional" }
[stage.specification]
goal = "What the docs must say"
baseline = ["Spec"]
[stage.planning]
goal = "A rollout plan when the blast radius warrants one (run5 pack fix)"
baseline = []
[[stage.planning.require]]
when = "blast_radius >= med"
artifacts = ["RolloutPlan"]

[stage.implement]
goal = "Docs written in the right quadrant"
baseline = ["Docs"]
[stage.review]

goal = "Docs reviewed"
baseline = ["ReviewVerdict"]
# R3 (2026-09-08): criticality raises the rigor of the change review (§9c.26, D20)
[[stage.review.require]]
when = "criticality >= high"
artifacts = ["ReviewVerdict"]
rigor = "mandatory"
[stage.release]
goal = "Published"
baseline = ["BuildArtifact", "ReleaseRecord"]
[stage.closeout]
goal = "Closed"
baseline = ["ClosureRecord"]
finally = true
