# reach: (project, review, recommended) — require row "kind in [initiative, project]" → DesignVerdict
[activity]
id           = "design-review"
version      = 1
stage        = "review"
provides     = ["DesignVerdict"]
requires     = ["DesignDoc", "ADR?", "ThreatModel?"]
derived_from = ["DesignDoc", "ADR?"]
tags         = ["kind:initiative", "kind:project"]
method_rank  = 10
min_rigor    = "recommended"
cost_class   = "M"
evidence     = ["Findings", "HumanAnswer?"]
budget       = { attempts_total = 3, tokens = 300_000, wall_clock_secs = 3600 }
deviation_ok = []
keywords     = ["design review", "architecture review", "ADR review"]
rationale    = "SWEBOK ch.3 §6.1 / ch.2 §4.3: the item-level design verdict before implementation is cut into stories."

[[step]]
id      = "review"
kind    = "agent"
role    = "reviewer"
inputs  = { design = "artifact:DesignDoc", adr = "artifact:ADR?", threats = "artifact:ThreatModel?", checklist = "checklist:design-doc" }
outputs = "value:Findings"
timeout_secs = "${toolchain.review_timeout}"
retry   = { max = 1 }

[[step]]
id      = "verdict"
kind    = "check"
inputs  = { findings = "${review.outputs}" }
expr    = "findings.none(severity in ['blocking'])"
on_false = "continue"

[[step]]
id      = "override"
kind    = "gate"
when    = "rigor >= mandatory and ${review.outputs.items}.len() > 0"
question = "review.blocking"
inputs  = { findings = "${review.outputs}" }

[[step]]
id      = "record"
kind    = "tool"
run     = "toolchain:verdict_record"
inputs  = { findings = "${review.outputs}", override = "${override.answer?}" }
outputs = "value:Verdict"
timeout_secs = 30
retry   = { max = 1 }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { DesignVerdict = "${record.outputs}" }
evidence  = ["${review}", "${override?}"]
