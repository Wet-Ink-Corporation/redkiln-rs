[activity]
id           = "adversarial-review"
version      = 2
stage        = "review"
provides     = ["ReviewVerdict"]
requires     = ["Spec", "ImplReport", "ChangeSummary"]
derived_from = ["Spec", "ImplReport", "ChangeSummary"]
tags         = ["kind:story", "kind:bug", "kind:security-vuln", "kind:tech-debt"]
method_rank  = 20
min_rigor    = "recommended"
cost_class   = "L"
evidence     = ["Findings", "HumanAnswer?"]
budget       = { attempts_total = 3, tokens = 600_000, wall_clock_secs = 7200 }
deviation_ok = []
keywords     = ["adversarial review", "findings", "reproduce", "mutation"]
rationale    = "F23/F26: a reviewer with Bash in a disposable clone beats the suite; F27: the verdict is policy, not the model."

[[step]]
id      = "clone"
kind    = "tool"
run     = "toolchain:shallow_clone"
inputs  = { sha = "artifact:ChangeSummary.sha" }
outputs = "value:Workspace"
timeout_secs = 120
retry   = { max = 2 }

[[step]]
id      = "review"
kind    = "agent"
role    = "reviewer"
inputs  = { spec = "artifact:Spec", report = "artifact:ImplReport", change = "artifact:ChangeSummary", workspace = "${clone.outputs}" }
outputs = "value:Findings"
timeout_secs = "${toolchain.review_timeout}"
retry   = { max = 1 }

[[step]]
id      = "verdict"
kind    = "check"
inputs  = { findings = "${review.outputs}" }
expr    = "findings.none(evidence in ['Reproduced', 'MutationSurvived']) and (rigor < mandatory or findings.none(evidence in ['NarrowedPin']))"
on_false = "override"

[[step]]
id      = "override"
kind    = "gate"
when    = "rigor >= mandatory"
question = "review.blocking"
inputs  = { findings = "${review.outputs}" }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { ReviewVerdict = "${verdict.outputs}" }
evidence  = ["${review}", "${override?}"]
