# --- the model table (s8h §8h.3; Record A = ADR-0197 decision 4, proposed) ---
#
# (dated 2026-10-02, s8h build) Each installed pack carries its own table, so each stays
# independently complete. The row's full id is what reaches `--model`, the `--agents` JSON
# and the card digest; adoption is exact equality with the init's reported `model` (RT-27).
