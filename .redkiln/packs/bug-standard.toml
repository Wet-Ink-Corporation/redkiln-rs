# v0 pack: bug-standard (proposal §2.3 shape; §9b.17 spawn row form). Authored 2026-09-07 for P6 before any lattice run.
# NO RECORD names this number. The corpus anchors the FLOOR: F18/F19's gates
# had no deadline mechanism and the longest was answered at 226 h (AC register,
# expiry scope note), so a deadline under that would have expired gates that
# were in fact answered. 10 days clears it. Authored at Step 7e -- RT-57, OWED.
gate_deadline_secs = 864000
[pack]
id = "bug-standard"
applies = "kind == bug and cos != expedite"
# appetite.tokens and appetite.dispatches (dated 2026-10-02, s8h build, package P5-kernel-envelope):
# Record B = ADR-0198 decisions 2 and 4 (proposed). tokens is the per-item token appetite, the sum of
# Usage's four counters (D21-43 N17 Q2), 2 x 17 x 681083 rounded up; dispatches is the per-item
# dispatch cap, D21-42 19a's 40. The kernel counts both from the store before each dispatch and
# refuses past either (Exit::Overage, 20). points stays step 5's cost-class sum (AC-020).
appetite = { points = 40, tokens = 24000000, dispatches = 40 }   # S=1 M=3 L=8 XL=20 (unit is an F35 ambiguity)

[policy]
stages = { triage = "mandatory", discovery = "forbidden", analysis = "recommended", specification = "optional", design = "optional", planning = "optional", implement = "mandatory", verify = "mandatory", review = "mandatory", release = "recommended", operate = "forbidden", closeout = "recommended" }   # P6 run1 fix: Postmortem row needs min_rigor recommended
# ADR-0153: the LANE ORDER, and the only ordered stage carrier. `stages` above is an inline
# table, and a TOML table has no order -- `toml_subset`'s `Table` is a `BTreeMap`, so those
# twelve keys come back alphabetised, and `parse_spans` cannot recover the textual order
# either because the whole inline table sits on one line. An array is the only shape that
# keeps it. This transcribes the order `stages` is written in; the two key sets must match
# exactly or the pack refuses to load.
stage_order = ["triage", "discovery", "analysis", "specification", "design", "planning", "implement", "verify", "review", "release", "operate", "closeout"]
# s8g (2026-09-29): AC-139's shipped default, block (fail-closed), recorded as the human decision (D21-43 N24; R2 =
# ADR-0192 decision 5, proposed). AC-455's row: an AC with no `verification` refuses the verify stage.
verification_required = ["verify"]

[stage.analysis]
goal = "The defect reproduces deterministically and its cause is established"
baseline = ["ReproCase", "RootCause"]
[[stage.analysis.require]]
when = "criticality >= high"
artifacts = ["CausalChain"]

[stage.specification]
goal = "Expected behaviour and the regression test intent are written"
baseline = ["Spec"]

[stage.design]
goal = "Fix location and recurrence guard chosen"
baseline = []
[[stage.design.require]]
when = "criticality >= high"
artifacts = ["FixDesign"]

[stage.planning]
goal = "Rollout and size are known when they matter"
baseline = []
[[stage.planning.require]]
when = "blast_radius >= med"
artifacts = ["RolloutPlan"]
[[stage.planning.require]]
when = "size >= high"
artifacts = ["Estimate"]

[stage.implement]
goal = "A tested change exists with a readable summary"
baseline = ["Changeset", "ImplReport", "ChangeSummary"]
# R3 (2026-09-08): criticality raises the rigor of test design; the family escalates on rigor only (§9c.26, D20)
# s8g (2026-09-29, D21-43 N23; R1 = ADR-0191 decision 5, proposed): MOVED from [stage.verify], where it was over
# TestReport, with its when and rigor. TestReport is pass-sourced, and a rigor floor on it selects nothing.
[[stage.implement.require]]
when = "criticality >= high"
artifacts = ["AuthoredTests"]
rigor = "mandatory"

[stage.verify]

goal = "The repro passes at the fix sha and nothing regressed"
baseline = ["TestReport", "ConfirmationResult", "SmokeResult"]
# s8g (2026-09-29, D21-43 N23): the criticality >= high test-design escalation MOVED to [stage.implement] over
# AuthoredTests (it read: when = "criticality >= high", artifacts TestReport, rigor = "mandatory").
[[stage.verify.require]]
when = "'text' in change"
artifacts = ["ScanReport"]
[[stage.verify.require]]
when = "criticality >= high and rigor >= mandatory"
artifacts = ["MutationSummary"]

[stage.review]

goal = "An independent verdict on the change"
baseline = ["ReviewVerdict"]
# R3 (2026-09-08): criticality raises the rigor of the change review (§9c.26, D20)
[[stage.review.require]]
when = "criticality >= high"
artifacts = ["ReviewVerdict"]
rigor = "mandatory"
# Step 7e (2026-09-21) -- DROPPED: [[stage.review.require]] when = 'auth', artifacts = ["SecurityReviewVerdict"]. `auth` withdrawn (ADR-0089 d2/ADR-0093 d1). The demand rides on catalog/security-review.toml's applicable_if.
[[stage.review.require]]
when = "blast_radius >= high"
artifacts = ["ChangeRecord"]

[stage.release]
# s8g (2026-09-29, R5 = ADR-0195 decision 6, proposed; D21-42 6b): AMENDED, not read. A run that makes a local tag
# and pushes nothing puts nothing in production. It read: goal = "The fix is in production reversibly".
goal = "The fix is tagged for release, reversibly"
baseline = ["BuildArtifact", "ReleaseRecord"]
# Step 7e (2026-09-21) -- DROPPED: [[stage.release.require]] when = 'data_migration', artifacts = ["MigrationLog"]. `data_migration` may key no require row (AC-520, ADR-0093 d2).

[stage.closeout]
goal = "Shortcuts logged, item closed"
baseline = ["DebtRegisterEntry", "ClosureRecord"]
finally = true
[[stage.closeout.require]]
when = "rigor >= recommended"
artifacts = ["Retrospective"]
[[stage.closeout.require]]
when = "criticality >= high"
artifacts = ["Postmortem"]

# ============================================================================
# Step 7e (2026-09-21) -- the installed pack's own tables.
#
# `spikes/p9/` authored none of these: measured 2026-09-14, `grep -rn
# 'attempts_cap|consecutive_platform|tokens' spikes/p9/packs/` -> 0 hits across all
# twelve shipped packs. `crates/rk-kernel/src/workflow/envelope.rs`:66-69 names them
# as this step's: "the shipped packs' own tables are Step 7e's". The record fixing
# the key SPELLINGS is RT-57, routed at `s7d` §7d.18 as "7e's pack schema record
# re-points" -- OWED BY THIS STEP, not discharged by authoring the keys.
# ============================================================================

# --- the staleness policy, per cost class, with its warrant (§7e.3) ---
#
# Decision 5 (DECISIONS-2026-09-11 #4) and ADR-0117 clause 1: `rematerialise`, at
# COARSE `derived_from` scope, for EVERY class in Phase 1. Fine scope stays
# available and is never mandatory. ADR-0117 clause 2: METHOD-P §2.4 criterion 1's
# prescribed remedy is NOT applied. The warrant, beside the value:
#   F40 §3-§4 -- coarse marks 5 Stale vs fine 15 on the 33 rows both scopes scored;
#   10 rows flip Present->Stale coarse-to-fine, none the other way [§3]; criterion 1's
#   own remedy is contraindicated [§4] (Halt 12).
#
# The kernel deliberately does NOT read this key -- `crates/rk-kernel/src/select/
# pack.rs`:45-47, "PROVISIONAL under ADR-0117 clause 4 ... deliberately not read".
# AC-068's register-named instrument `redkiln lint --stale-policy` does not exist in
# the CLI Step 7d built, so the only verifier of these rows is Checkpoint 7e's grep.
# That substitution is DECLARED here rather than left for the grep to paper over.

[policy.S]
stale_policy = "rematerialise"   # decision 5; coarse derived_from scope

[policy.M]
stale_policy = "rematerialise"   # decision 5; coarse derived_from scope

[policy.L]
stale_policy = "rematerialise"   # decision 5; coarse derived_from scope

[policy.XL]
stale_policy = "rematerialise"   # decision 5; coarse derived_from scope

# --- the retry envelope (AC-029) ---
#
# BACKOFF IS NOT HERE. Base 2 s and the 5 min cap are KERNEL policy stated in
# AC-029 (PIA-055: "only K, N and the appetite are pack values"); a code default
# for either is refused, and so is a pack declaration of them.
#
# DERIVED: each class's N is the maximum `budget.attempts_total` any activity in
# that class declares, so the pack's N can never contradict a catalog budget --
# AC-029: "the attempt count never exceeds the pack's N".
#   S -> 6;  M -> 8;  L -> 12;  XL -> 14
#
# `attempts_cap` is FLAT and is the key the kernel actually reads
# (`select/pack.rs`:340 `declared_u32(&doc, "retry", "attempts_cap", ...)`);
# `require_attempt_cap` refuses a pack that declares none, so the per-class tables
# below are IN ADDITION TO it, never instead of it.

[retry]
attempts_cap = 14   # the max across every class, so no activity can exceed it

[retry.S]
attempts = 6

[retry.M]
attempts = 8

[retry.L]
attempts = 12

[retry.XL]
attempts = 14

# --- breaker, margins, cache, gate deadline ---
#
# 🛑 THE THREE NUMBERS BELOW MARKED `NO RECORD` ARE AUTHORED HERE AND NAMED BY NO
# RECORD. They are written because `PackExtras` and the doctor rule table require
# them and a code default is refused; the record that fixes them is RT-57's, OWED.

[breaker]
# AC-033: "K consecutive `Platform` failures for one model family". K is a pack
# value; NO RECORD names the number.
consecutive_platform_failures = 3   # NO RECORD -- authored at Step 7e (RT-57)
expiry_secs = 600                   # NO RECORD -- authored at Step 7e (RT-57)

[margins]
# A margin below 2 ticks is a load-time lint error (AC register: "margin_ticks < 2"),
# so 2 is the floor. 10 ticks is the PRIOR-ART value moved out of code: the runner's
# `max_five_hour: 0.90` was a code margin (`rk-adapter-claude/src/throttle.rs`:26),
# and ADR-0078's point is that it comes from the pack, never "from a code default".
five_hour = 10
seven_day = 10

[cache]
# DERIVED from `rk_adapter_claude::config::CACHE_TTL` (= '1h'), which is itself
# ADR-0078 (ii)'s recorded value, not a code guess. RK-D-TTL compares against it
# and AC-210 names both keys.
prompt_ttl = "1h"
subagent_prompt_ttl = "1h"

# --- the roles this pack declares (RK-D-DANGLING-ROLE) ---
#
# The eight roles the shipped catalog's steps nominate, measured on disk:
#   architect, implementer, investigator, operator, planner, releaser, reviewer, spec-author

[role.architect]
family = "claude"

[role.implementer]
family = "claude"

[role.investigator]
family = "claude"

[role.operator]
