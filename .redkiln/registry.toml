# ---- The per-toolchain value tables (D21-42 4a; ADR-0170 decision 9). Keyed by the `toolchain` facet's value; rk-cli
# selects one and hands the kernel a flat, name-free ToolchainValues (AC-487). Every value carries its warrant (secs,
# measured, rule, pin, and exactly one of command / source) or is declared `unmeasured`. A value above the construction
# bound is legal and not clamped: ADR-0171's min makes the construction bound win.

[toolchain.rust]
# (dated 2026-09-26, s8c build, re-measure; D21-64 ruling 8.) The four measured rows below were re-taken at
# 2f3f6ab257c4b21c1bd16bcd4781f97475f958f5 (366543a plus the uncommitted leak and cvss packages, a commit object on
# no ref) by s8c section 8c.5's script, n = 3, and re-derived by ADR-0170 decision 10. The struck values and the
# readings they came from, kept as history (pin 6f70e47786474cce0466369a6e0f5e282321af1c, P8):
#   ~~test_timeout secs = 300~~ (now 360): pass 1 list_cold 93, list_ignored 3, run 146, doc 2; pass 2 88, 3, 142, 3;
#     pass 3 88, 3, 142, 3.
#   build_timeout secs = 120, unchanged: builds 58, 58, 56.
#   scan_timeout secs = 60, unchanged: audit + deny 0 + 1, 0 + 1, 1 + 0.
#   setup_timeout secs = 60, unchanged: installs 2, 8, 4, downloaded 0 on each.
# (dated 2026-09-26, s8c refuting round 3.) "on no ref" above is superseded: the pin is held by the LOCAL ref
# refs/redkiln/pins/s8c-remeasure (git for-each-ref refs/redkiln/pins/). A clone or fetch does not bring it (origin's
# refspec is refs/heads/*), so before s8c's close the ref is pushed with the branch or these rows are re-pinned to a
# commit a branch reaches (ADR-0170's evidence; s8c section 8c.5).
test_timeout = { secs = 360, measured = [{ secs = 99, pass = 1, child = "list_cold" }, { secs = 3, pass = 1, child = "list_ignored" }, { secs = 152, pass = 1, child = "run" }, { secs = 3, pass = 1, child = "doc" }, { secs = 86, pass = 2, child = "list_cold" }, { secs = 3, pass = 2, child = "list_ignored" }, { secs = 152, pass = 2, child = "run" }, { secs = 3, pass = 2, child = "doc" }, { secs = 87, pass = 3, child = "list_cold" }, { secs = 3, pass = 3, child = "list_ignored" }, { secs = 161, pass = 3, child = "run" }, { secs = 3, pass = 3, child = "doc" }], rule = "ADR-0170 decision 10, fixed 2026-09-26 before any reading: secs = 60 x ceil(2 x max(measured) / 60), the slowest reading over every pass (n = 3) and every child of every pass, never a median or a mean", pin = "2f3f6ab257c4b21c1bd16bcd4781f97475f958f5", command = "runbook/phase-1/s8c-toolchain-port-and-verbs.md §8c.5's measurement script (n = 3, through runbook/tools/nodispatch.sh, CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4), in a fresh detached worktree under .git/redkiln/tmp with its own empty CARGO_TARGET_DIR: the Rust adapter's test children on the runner the port selects (cargo-nextest 0.9.146 (8af696ddc 2026-09-21)): cargo test --workspace -- --list (cold), cargo test --workspace -- --list --ignored, cargo nextest run --workspace --no-fail-fast --retries 0 --color never --status-level pass --final-status-level none, and the doctest companion cargo test --workspace --doc --no-fail-fast; each child timed" }
build_timeout = { secs = 120, measured = [{ secs = 57, pass = 1 }, { secs = 58, pass = 2 }, { secs = 57, pass = 3 }], rule = "ADR-0170 decision 10, fixed 2026-09-26 before any reading: secs = 60 x ceil(2 x max(measured) / 60), the slowest reading over every pass (n = 3), never a median or a mean", pin = "2f3f6ab257c4b21c1bd16bcd4781f97475f958f5", command = "runbook/phase-1/s8c-toolchain-port-and-verbs.md §8c.5's measurement script (n = 3, through runbook/tools/nodispatch.sh, CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4), in a fresh detached worktree under .git/redkiln/tmp with its own empty CARGO_TARGET_DIR: cargo build --workspace --message-format=json (cold), the port's build argv" }
scan_timeout = { secs = 60, measured = [{ secs = 2, pass = 1, audit = 1, deny = 1 }, { secs = 1, pass = 2, audit = 0, deny = 1 }, { secs = 2, pass = 3, audit = 1, deny = 1 }], rule = "ADR-0170 decision 10, fixed 2026-09-26 before any reading: secs = 60 x ceil(2 x max(measured) / 60), the slowest reading over every pass (n = 3), each pass's audit + deny sum, never a median or a mean", pin = "2f3f6ab257c4b21c1bd16bcd4781f97475f958f5", command = "runbook/phase-1/s8c-toolchain-port-and-verbs.md §8c.5's measurement script (n = 3, through runbook/tools/nodispatch.sh, CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4), in a fresh detached worktree under .git/redkiln/tmp with its own empty CARGO_TARGET_DIR: the sca_scan verb's two children summed per pass: cargo audit --json --no-fetch --db <~/.cargo/advisory-db> --file Cargo.lock, and cargo deny --offline -L debug --format json --config <db-path = ~/.cargo/advisory-dbs> check advisories --audit-compatible-output; both databases at e2111519ba6d14a5da59a7b2e5c8083ae8a37c01" }
setup_timeout = { secs = 60, measured = [{ secs = 1, pass = 1, downloaded = 0, network = false }, { secs = 2, pass = 2, downloaded = 0, network = false }, { secs = 4, pass = 3, downloaded = 0, network = false }], rule = "ADR-0170 decision 10, fixed 2026-09-26 before any reading: secs = 60 x ceil(2 x max(measured) / 60), the slowest reading over every pass (n = 3), never a median or a mean", pin = "2f3f6ab257c4b21c1bd16bcd4781f97475f958f5", command = "runbook/phase-1/s8c-toolchain-port-and-verbs.md §8c.5's measurement script (n = 3, through runbook/tools/nodispatch.sh, CARGO_BUILD_JOBS=4 RUST_TEST_THREADS=4), in a fresh detached worktree under .git/redkiln/tmp with its own empty CARGO_TARGET_DIR: the setup verb's install, pnpm install --frozen-lockfile --prefer-offline --dir crates/rk-adapter-toolchain-node/tests/fixtures/project, over the local pnpm store as it stood; downloaded is pnpm's own count, and a reading with downloaded above zero is a network reading" }
review_timeout = { secs = 9180, measured = [4561], rule = "ADR-0170 decision 10, fixed 2026-09-26 before any reading: secs = 60 x ceil(2 x max(measured) / 60), the slowest reading over every pass (n = 3), over the cited reading, never a median or a mean; AC-223's floor, the recorded maximum and not the median, holds", pin = "6f70e47786474cce0466369a6e0f5e282321af1c", source = "references/2026-09-08-acceptance-criteria.md, AC-223's evidence line: F31/S-TYPED [measured: CLEAN review median 1,071 s, slowest 4,561 s] (the review class's own dispatch-duration record)" }
implement_timeout = { secs = 4800, measured = [4561], rule = "D21-48 X4's value, not decision 10's output (which would give 9180 over the same borrowed reading): re-derived by ADR-0170 decision 11 from the recorded maximum of the implement class (tdd-red-green-refactor red/green/refactor, equivalence-boundary/write, docs-update/write)'s own dispatch-duration record once one exists, by decision 10's rule and never below AC-223's floor; until then 4800 stands", pin = "6f70e47786474cce0466369a6e0f5e282321af1c", source = "spikes/DECISIONS-2026-09-21.md D21-48 X4: 4,800 s, cited to F31/S-TYPED's slowest agent dispatch (4,561 s) as a borrowed class; no dispatch-duration record exists for this key's own class. references/2026-09-08-acceptance-criteria.md, AC-223's evidence line: F31/S-TYPED [measured: CLEAN review median 1,071 s, slowest 4,561 s]" }
repro_timeout = { secs = 4800, measured = [4561], rule = "D21-48 X4's value, not decision 10's output (which would give 9180 over the same borrowed reading): re-derived by ADR-0170 decision 11 from the recorded maximum of minimal-repro/attempt's own dispatch-duration record once one exists, by decision 10's rule and never below AC-223's floor; until then 4800 stands", pin = "6f70e47786474cce0466369a6e0f5e282321af1c", source = "spikes/DECISIONS-2026-09-21.md D21-48 X4: 4,800 s, cited to F31/S-TYPED's slowest agent dispatch (4,561 s) as a borrowed class; no dispatch-duration record exists for this key's own class. references/2026-09-08-acceptance-criteria.md, AC-223's evidence line: F31/S-TYPED [measured: CLEAN review median 1,071 s, slowest 4,561 s]" }
deploy_timeout = { unmeasured = "no Phase-1 Rust verb deploys (s8c §8c.5)" }
migration_timeout = { unmeasured = "no Phase-1 Rust verb migrates (s8c §8c.5)" }
cook_timeout = { unmeasured = "no Phase-1 Rust verb cooks (s8c §8c.5)" }
