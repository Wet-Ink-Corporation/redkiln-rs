# Written by `redkiln init` (Step 7d). Step 7e fills [packs].enabled; every other key is read at startup
# (AC-485/AC-486) and by `redkiln doctor` (AC-426). A second `init` leaves this file untouched (ADR-0107 d2).

[adapters]
harness = "rk-adapter-claude"
store = "rk-adapter-sqlite"
toolchains = ["rk-adapter-toolchain-node", "rk-adapter-toolchain-rust"]

[packs]
enabled = ["bug-standard", "story"]

# ADR-0159: the `<project>` component of every trailer value this system mints. NEVER derived --
# not from the pack, the lane, the item id, the worktree path or the remote -- because whatever is
# emitted BECOMES the project as far as `doctor --rebuild` is concerned, and an empty one degrades
# the trailer to a bare story id that records no transition.
[project]
name = "redkiln-rs"

[doctor]
unread_window_runs = 50
