# reach: (project, design, optional) — require row "kind in [initiative, project, tech-debt]" → ADR
[activity]
id           = "adr-record"
version      = 2   # bumped 2026-09-26 (s8d, ADR-0072; .redkiln/CHANGELOG.md)
stage        = "design"
provides     = ["ADR"]
requires     = ["Spec", "DesignDoc?", "ArchitectureDescription?"]
derived_from = ["Spec", "DesignDoc?"]
tags         = ["kind:initiative", "kind:project", "kind:story", "kind:tech-debt"]
method_rank  = 10
min_rigor    = "optional"
cost_class   = "S"
evidence     = ["SelfCheck", "HumanAnswer?"]
budget       = { attempts_total = 3, tokens = 100_000, wall_clock_secs = 1200 }
human_source_ok = true
deviation_ok = ["skip"]
keywords     = ["ADR", "architecture decision record", "nygard"]
rationale    = "adr.github.io: the decision, its context, options and consequences, in the .kb decisions layer; accepted decisions are immutable there."

[[step]]
id      = "draft"
kind    = "agent"
role    = "architect"
inputs  = { spec = "artifact:Spec", design = "artifact:DesignDoc?", arch = "artifact:ArchitectureDescription?", kb = "kb:architecture-conventions" }
outputs = "value:ADR"
timeout_secs = 600
retry   = { max = 2 }

[[step]]
id      = "self-check"
kind    = "agent"
role    = "architect"
inputs  = { draft = "${draft.outputs}", checklist = "checklist:adr" }
outputs = "value:SelfCheck"
timeout_secs = 300
retry   = { max = 1 }

[[step]]
id      = "complete"
kind    = "check"
inputs  = { draft = "${draft.outputs}", check = "${self-check.outputs}" }
expr    = "draft.options.len() >= 2 and draft.consequences.len() > 0 and check.failed == 0"
on_false = { to = "draft", max = 2 }

[[step]]
id      = "accept"
kind    = "gate"
when    = "rigor >= recommended"
question = "adr.accept"
inputs  = { adr = "${draft.outputs}" }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { ADR = "${draft.outputs}" }
evidence  = ["${self-check}", "${accept?}"]
