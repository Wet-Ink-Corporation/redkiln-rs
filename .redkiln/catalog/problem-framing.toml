# reach: (initiative, discovery, optional) — baseline ProblemStatement
# discovery spine family: problem-framing(10) < assumption-mapping(20) < opportunity-solution-tree(30) < design-sprint(40)
#   members provide DIFFERENT kinds; rank is inert for selection (F34 ambiguity B3)
[activity]
id           = "problem-framing"
version      = 1
stage        = "discovery"
provides     = ["ProblemStatement"]
requires     = ["IntakeRecord"]
derived_from = ["IntakeRecord"]
tags         = ["kind:initiative", "kind:project", "kind:spike"]
method_rank  = 10
min_rigor    = "optional"
cost_class   = "S"
evidence     = ["SelfCheck", "Findings?", "HumanAnswer?"]
budget       = { attempts_total = 5, tokens = 150_000, wall_clock_secs = 1800 }
human_source_ok = true
deviation_ok = []
keywords     = ["problem statement", "framing", "why now", "shape up narrow down"]
rationale    = "Shape Up: narrow down the problem before any solution; the ProblemStatement is the discovery baseline every pack keeps."

[[step]]
id      = "frame"
kind    = "agent"
role    = "investigator"
inputs  = { intake = "artifact:IntakeRecord", kb = "kb:discovery-conventions", findings = "${adversary.outputs?}" }
outputs = "value:ProblemStatement"
timeout_secs = 600
retry   = { max = 2 }

[[step]]
id      = "self-check"
kind    = "agent"
role    = "investigator"
inputs  = { draft = "${frame.outputs}", checklist = "checklist:problem-framing" }
outputs = "value:SelfCheck"
timeout_secs = 300
retry   = { max = 1 }

[[step]]
id      = "adversary"
kind    = "agent"
role    = "reviewer"
when    = "rigor >= recommended"
inputs  = { draft = "${frame.outputs}", intake = "artifact:IntakeRecord" }
outputs = "value:Findings"
timeout_secs = 600
retry   = { max = 1 }

[[step]]
id      = "policy"
kind    = "check"
inputs  = { check = "${self-check.outputs}", findings = "${adversary.outputs?}" }
expr    = "check.failed == 0 and findings.none(severity in ['blocking'])"
on_false = { to = "frame", max = 2 }

[[step]]
id      = "signoff"
kind    = "gate"
when    = "rigor >= mandatory"
question = "draft.accept"
inputs  = { draft = "${frame.outputs}", findings = "${adversary.outputs?}" }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { ProblemStatement = "${frame.outputs}" }
evidence  = ["${self-check}", "${adversary?}", "${signoff?}"]
