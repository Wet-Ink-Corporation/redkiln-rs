# reach: (project, verify, recommended) — require row "kind == project or external_dep" → IntegrationReport
# (dated 2026-09-29, s8g, D21-46 R5 and D21-48 X9: "The whole activity moves to implement, because stage membership
#   is per activity"; R1 = ADR-0191 decision 6, proposed) RE-HOMED WHOLE to implement: `write` authors the tests and
#   `run` and `green` move with it; AuthoredTests listed first, IntegrationReport kept (story.toml's external_dep row
#   moved to [stage.implement] with it). Verify still measures: the pass's whole suite runs these tests.
[activity]
id           = "integration-tests"
version      = 3   # bumped 2026-09-29 (s8g, D21-46 R5 / D21-48 X9; ADR-0072; .redkiln/CHANGELOG.md)
stage        = "implement"
provides     = ["AuthoredTests", "IntegrationReport"]
requires     = ["Changeset", "Spec", "APIContract?"]
derived_from = ["Changeset", "APIContract?"]
tags         = ["kind:project", "kind:story"]   # run6: integration runs through the toolchain port for any toolchain
applicable_if = "kind == project or external_dep"
method_rank  = 10
min_rigor    = "recommended"
cost_class   = "M"
evidence     = ["GreenAt", "ToolReport"]
budget       = { attempts_total = 5, tokens = 250_000, wall_clock_secs = 5400 }
deviation_ok = ["skip"]
keywords     = ["integration tests", "service interaction", "contract"]
rationale    = "ISTQB integration level / the implement skill's Integration phase: interactions between components are proven in the real app, not mocked away."

[[step]]
id      = "write"
kind    = "agent"
role    = "implementer"
inputs  = { spec = "artifact:Spec", change = "artifact:Changeset", contract = "artifact:APIContract?", last = "${run.outputs?}" }
outputs = "value:ImplReport"
timeout_secs = "${toolchain.implement_timeout}"
retry   = { max = 2 }

[[step]]
id      = "run"
kind    = "tool"
run     = "toolchain:test"
inputs  = { selection = "${write.outputs.tests_added}" }
outputs = "value:TestReport"
timeout_secs = "${toolchain.test_timeout}"
retry   = { max = 1 }

[[step]]
id      = "green"
kind    = "check"
inputs  = { report = "${run.outputs}" }
expr    = "report.status == 'passing'"
on_false = { to = "write", max = 2 }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { AuthoredTests = "${write.outputs}", IntegrationReport = { status = "${run.outputs.status}", passed = "${run.outputs.passed}", failed = "${run.outputs.failed}", sha = "${run.outputs.sha}" } }   # composing emit (§9c.34)
evidence  = ["${run}"]
