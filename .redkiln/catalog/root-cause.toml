[activity]
id           = "root-cause"
version      = 6   # bumped 2026-11-08 (s8 repro-pair route, ADR-0072; ADR-0204 decision 4, proposed; .redkiln/CHANGELOG.md)
stage        = "analysis"
provides     = ["RootCause"]
requires     = ["ReproCase"]
derived_from = ["ReproCase"]
tags         = ["kind:bug", "kind:incident", "change:text"]
method_rank  = 10
family       = "localisation"
max_rigor    = "recommended"   # §9c.26 ceiling — the family escalates above this
min_rigor    = "optional"
cost_class   = "M"
evidence     = ["Findings?", "GreenAt", "ToolReport", "HumanAnswer?"]
budget       = { attempts_total = 8, tokens = 400_000, wall_clock_secs = 5400 }
deviation_ok = ["add", "downgrade"]
keywords     = ["debugging", "sre troubleshooting", "hypothesis"]
rationale    = "SRE ch.12 hypothetico-deductive loop, confirmed by a discriminating test."

[[step]]
id      = "hypothesise"
kind    = "agent"
role    = "investigator"
inputs  = { repro = "artifact:ReproCase", telemetry = "toolchain:logs?", hint = "${no-hypothesis.answer?}", findings = "${adversary.outputs?}" }
outputs = "value:HypothesisLog"
timeout_secs = 900
retry   = { max = 2 }
repeat  = { until = "${hypothesise.outputs.status} == 'confirmed'", max = 3 }
on_exhausted = "escalate"
escalate = { question = "root-cause.no-hypothesis" }

[[step]]
id      = "no-hypothesis"
kind    = "gate"
question = "root-cause.no-hypothesis"
when    = "${hypothesise.outputs.status} != 'confirmed'"
inputs  = { log = "${hypothesise.outputs}" }

# The placed, trusted repro command (ADR-0204 decision 4): a read-only investigator cannot write or run a
# discriminating test, so `confirm` re-runs the committed repro, and `policy`'s `report.failed > 0` holds on it.
[[step]]
id      = "confirm"
kind    = "tool"
run     = "toolchain:test"
inputs  = { selection = "artifact:ReproCase.command" }
outputs = "value:TestReport"
timeout_secs = "${toolchain.test_timeout}"
retry   = { max = 1 }

[[step]]
id      = "adversary"
kind    = "agent"
role    = "reviewer"
when    = "rigor >= recommended"
inputs  = { log = "${hypothesise.outputs}", report = "${confirm.outputs}" }
outputs = "value:Findings"
timeout_secs = 1200
retry   = { max = 1 }

[[step]]
id      = "policy"
kind    = "check"
inputs  = { report = "${confirm.outputs}", findings = "${adversary.outputs?}" }
expr    = "report.failed > 0"
on_false = { to = "hypothesise", max = 2 }

[[step]]
id      = "signoff"
kind    = "gate"
when    = "rigor >= mandatory"
question = "root-cause.accept"
inputs  = { summary = "${hypothesise.outputs.summary}", findings = "${adversary.outputs?}" }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { RootCause = { cause = "${hypothesise.outputs.root_cause.cause}", contributing_factors = "${hypothesise.outputs.root_cause.contributing_factors}", confidence = "${hypothesise.outputs.root_cause.confidence}", summary = "${hypothesise.outputs.root_cause.summary}", discriminating_test = "artifact:ReproCase.command", rationale = "${hypothesise.outputs.root_cause.rationale}" } }   # composing emit (§9c.34): `discriminating_test` is the committed repro's command, never an agent's
evidence  = ["${confirm}", "${adversary?}", "${signoff?}"]
