# reach: (docs, implement, optional) — require row "kind == docs" → Docs; (story, implement, recommended) as a by-product row
[activity]
id           = "docs-update"
version      = 5   # bumped 2026-09-29 (s8g, D21-126; ADR-0072; .redkiln/CHANGELOG.md docs-update@5)
stage        = "implement"
provides     = ["Docs", "Changeset"]   # P6 run1 fix: docs release needs a Changeset
requires     = ["Spec", "Changeset?"]
derived_from = ["Spec", "Changeset?"]
tags         = ["kind:docs", "kind:story", "kind:project"]   # run6: docs are text whatever the item's toolchain
method_rank  = 5    # run4: tie with test-after(10) on Changeset for docs — docs-update is the docs producer
min_rigor    = "optional"
cost_class   = "S"
evidence     = ["SelfCheck", "ToolReport"]
budget       = { attempts_total = 5, tokens = 200_000, wall_clock_secs = 2400 }
deviation_ok = ["skip"]
keywords     = ["diataxis", "tutorial how-to reference explanation", "docs"]
rationale    = "Diátaxis: every change lands its docs in the right quadrant; the checklist catches the wrong quadrant."

[[step]]
id      = "write"
kind    = "agent"
role    = "implementer"
inputs  = { spec = "artifact:Spec", change = "artifact:Changeset?", checklist = "checklist:docs-diataxis" }
outputs = "value:Docs"
timeout_secs = "${toolchain.implement_timeout}"
retry   = { max = 2 }

[[step]]
id      = "self-check"
kind    = "agent"
role    = "implementer"
inputs  = { docs = "${write.outputs}", checklist = "checklist:docs-diataxis" }
outputs = "value:SelfCheck"
timeout_secs = 300
retry   = { max = 1 }

[[step]]
id      = "policy"
kind    = "check"
inputs  = { check = "${self-check.outputs}" }
expr    = "check.failed == 0"
on_false = { to = "write", max = 2 }

[[step]]
id      = "summary"
kind    = "tool"
run     = "toolchain:change_summary"
inputs  = { range = "baseline..HEAD" }
outputs = "value:ChangeSummary"
timeout_secs = 120
retry   = { max = 1 }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { Docs = "${write.outputs}", Changeset = "${summary.outputs}" }
evidence  = ["${self-check}"]
