[activity]
id           = "user-story-ac"
version      = 3   # bumped 2026-09-25 (s8b, ADR-0072; .redkiln/CHANGELOG.md)
stage        = "specification"
provides     = ["Spec"]
requires     = ["IntakeRecord", "ProblemStatement?"]   # P6 run1 fix: discovery is forbidden for stories, so ProblemStatement cannot be produced there — the intake is the story's problem
derived_from = ["IntakeRecord", "ProblemStatement?", "RootCause?"]
tags         = ["kind:story", "kind:project", "kind:tech-debt", "kind:docs"]   # P6 batch edit 2026-09-07: kind:bug removed — fix-spec provides Spec for bugs (raw §4 row); P6 run1 fix: tech-debt/docs had no Spec producer
method_rank  = 10
family       = "spec-form"
max_rigor    = "recommended"   # §9c.26 ceiling — the family escalates above this
min_rigor    = "optional"
cost_class   = "S"
evidence     = ["SelfCheck?", "Findings?", "HumanAnswer?"]
budget       = { attempts_total = 5, tokens = 200_000, wall_clock_secs = 2400 }
deviation_ok = ["downgrade"]
keywords     = ["user story", "acceptance criteria", "given when then"]
rationale    = "Cheapest spec form in the ordered family; ACs are the join key for verify and review."

[[step]]
id      = "draft"
kind    = "agent"
role    = "spec-author"
inputs  = { intake = "artifact:IntakeRecord", problem = "artifact:ProblemStatement?", cause = "artifact:RootCause?", kb = "kb:spec-conventions", findings = "${adversary.outputs?}" }
outputs = "value:Spec"
timeout_secs = 600
retry   = { max = 2 }

[[step]]
id      = "self-check"
kind    = "agent"
role    = "spec-author"
inputs  = { spec = "${draft.outputs}", checklist = "checklist:ac-quality" }
outputs = "value:SelfCheck"
timeout_secs = 300
retry   = { max = 1 }

[[step]]
id      = "adversary"
kind    = "agent"
role    = "reviewer"
when    = "rigor >= recommended"
inputs  = { spec = "${draft.outputs}", intake = "artifact:IntakeRecord" }
outputs = "value:Findings"
timeout_secs = 600
retry   = { max = 1 }

[[step]]
id      = "policy"
kind    = "check"
inputs  = { findings = "${adversary.outputs?}", check = "${self-check.outputs}" }
expr    = "check.failed == 0"
on_false = { to = "draft", max = 2 }

[[step]]
id      = "ambiguity"
kind    = "gate"
when    = "rigor >= mandatory and ${draft.outputs.open_questions}.len() > 0"
question = "spec.ambiguity"
inputs  = { questions = "${draft.outputs.open_questions}" }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { Spec = "${draft.outputs}" }
evidence  = ["${self-check}", "${adversary?}", "${ambiguity?}"]
