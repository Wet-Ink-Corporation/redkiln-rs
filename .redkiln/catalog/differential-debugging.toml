# reach: (bug, analysis, optional) with change = {binary} — root-cause(10) tags change:text, so this is the lowest
#   applicable RootCause producer for a binary-only change; otherwise deviation add
# localisation family: root-cause(10, =hypothesis-troubleshooting) < differential-debugging(20) < bisect(30) < instrumented-trace-analysis(40)
[activity]
id           = "differential-debugging"
version      = 3   # bumped 2026-09-25 (s8b, ADR-0072; .redkiln/CHANGELOG.md)
stage        = "analysis"
provides     = ["RootCause"]
requires     = ["ReproCase"]
derived_from = ["ReproCase"]
tags         = ["kind:bug", "kind:incident", "kind:security-vuln"]
method_rank  = 20
family       = "localisation"
max_rigor    = "recommended"   # §9c.26 ceiling — the family escalates above this
min_rigor    = "optional"
cost_class   = "M"
evidence     = ["ToolReport", "GreenAt", "Findings?", "HumanAnswer?"]
budget       = { attempts_total = 8, tokens = 400_000, wall_clock_secs = 5400 }
deviation_ok = ["add", "downgrade"]
keywords     = ["differential debugging", "known good", "what changed", "divide and conquer"]
rationale    = "Agans 'divide and conquer' / SRE ch.12 'what changed': compare a known-good configuration against the failing one until the delta is one thing."

[[step]]
id      = "compare"
kind    = "agent"
role    = "investigator"
inputs  = { repro = "artifact:ReproCase", history = "toolchain:vcs_history?", telemetry = "toolchain:telemetry?", previous = "${compare.outputs?}", findings = "${adversary.outputs?}", hint = "${stuck.answer?}" }
outputs = "value:RootCause"
timeout_secs = 900
retry   = { max = 2 }
repeat  = { until = "${compare.outputs.confidence} == 'high'", max = 3 }
on_exhausted = "escalate"
escalate = { question = "loop.exhausted" }

[[step]]
id      = "stuck"
kind    = "gate"
when    = "${compare.outputs.confidence} != 'high'"
question = "loop.exhausted"
inputs  = { cause = "${compare.outputs}" }

[[step]]
id      = "confirm"
kind    = "tool"
run     = "toolchain:test"
inputs  = { selection = "${compare.outputs.discriminating_test}" }
outputs = "value:TestReport"
timeout_secs = "${toolchain.test_timeout}"
retry   = { max = 1 }

[[step]]
id      = "adversary"
kind    = "agent"
role    = "reviewer"
when    = "rigor >= recommended"
inputs  = { cause = "${compare.outputs}", report = "${confirm.outputs}" }
outputs = "value:Findings"
timeout_secs = 900
retry   = { max = 1 }

[[step]]
id      = "policy"
kind    = "check"
inputs  = { report = "${confirm.outputs}", findings = "${adversary.outputs?}" }
expr    = "report.failed > 0"
on_false = { to = "compare", max = 2 }

[[step]]
id      = "signoff"
kind    = "gate"
when    = "rigor >= mandatory"
question = "root-cause.accept"
inputs  = { cause = "${compare.outputs}", findings = "${adversary.outputs?}" }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { RootCause = "${compare.outputs}" }
evidence  = ["${confirm}", "${stuck?}", "${adversary?}", "${signoff?}"]
