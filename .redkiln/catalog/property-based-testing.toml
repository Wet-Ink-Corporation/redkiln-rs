# reach: (story, verify, recommended) — deviation add only: equivalence-boundary(30) covers every context this applies to (F34 ambiguity B1)
# test-design rigor family (see smoke-test)
# (dated 2026-09-29, s8g, D21-43 N23; R1 = ADR-0191 decision 3, proposed) RE-HOMED to implement over AuthoredTests;
#   the emit binds `invariants`' authored tests, and `run` and `confirm` are step evidence.
[activity]
id           = "property-based-testing"
version      = 3   # bumped 2026-09-29 (s8g, D21-43 N23; ADR-0072; .redkiln/CHANGELOG.md)
stage        = "implement"
provides     = ["AuthoredTests"]
requires     = ["Changeset", "Spec"]
derived_from = ["Changeset", "Spec"]
tags         = ["kind:story", "kind:bug", "toolchain:node", "toolchain:rust", "toolchain:python", "toolchain:dotnet"]
applicable_if = "'text' in change and criticality >= high and novelty >= high"
method_rank  = 40
family       = "test-design"
min_rigor    = "recommended"
cost_class   = "M"
evidence     = ["GreenAt", "ToolReport"]
budget       = { attempts_total = 6, tokens = 300_000, wall_clock_secs = 5400 }
deviation_ok = ["downgrade"]
keywords     = ["property-based testing", "quickcheck", "hypothesis", "fast-check", "invariants"]
rationale    = "QuickCheck lineage: generated inputs against invariants for novel core logic; needs a toolchain with a generator library, hence the toolchain tags."

[[step]]
id      = "invariants"
kind    = "agent"
role    = "implementer"
inputs  = { spec = "artifact:Spec", change = "artifact:Changeset", last = "${run.outputs?}" }
outputs = "value:ImplReport"
timeout_secs = "${toolchain.implement_timeout}"
retry   = { max = 2 }

[[step]]
id      = "run"
kind    = "tool"
run     = "toolchain:property_test"
inputs  = { tests = "${invariants.outputs.tests_added}" }
outputs = "value:TestReport"
timeout_secs = "${toolchain.test_timeout}"
retry   = { max = 1 }

[[step]]
id      = "green"
kind    = "check"
inputs  = { report = "${run.outputs}" }
expr    = "report.status == 'passing'"
on_false = { to = "invariants", max = 2 }

[[step]]
id      = "confirm"
kind    = "tool"
run     = "toolchain:test"
inputs  = { selection = "affected" }
outputs = "value:TestReport"
timeout_secs = "${toolchain.test_timeout}"
retry   = { max = 1 }

[[step]]
id      = "emit"
kind    = "emit"
artifacts = { AuthoredTests = "${invariants.outputs}" }
evidence  = ["${run}", "${confirm}"]
