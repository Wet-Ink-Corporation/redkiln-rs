# .redkiln/processes/questions.toml — the pack's question registry (ADR-0063; ADR-0129 decision 3), loaded by
# rk_cli::processes into rk_kernel's QuestionRegistry for `run` and `answer` alike. Shipped 2026-09-26 by s8d (§8d.6)
# under record R5 = ADR-0177, PROPOSED. The loader reads `.redkiln/processes/*.toml` and does not recurse; it is the
# only loader (D21-43: "The loader and `.redkiln/processes/` are **s8d**'s."), s8j authors the human-root questions
# into this directory, and s8g loads through it.
#
# Schema (R5 decision 7): each `[question."<id>"]` declares `text` and a non-empty `options` list, each option an id
# or `{ id, attaches = "<Kind>" }`; an optional `binds` lists further gate kinds answered by it. A question binds its
# own id as a gate kind, because a catalog `gate` step's kind is its `question` (ADR-0145). Any other key is refused.
#
# The first nine entries are every `gate` and `escalate` question the two lanes' selected activities declare
# (s8d §8d.6's table), transcribed with their text and options VERBATIM from spikes/p9/questions.toml. The tenth,
# `facet.change`, is D21-43 N3's: the question the operator answers the `unknown_facet:change` gate with at triage.
# Its options are transcribed from facets.toml's `[facet.change] values`, in that order; its text is the one line
# here not taken from spikes/p9. `spec.ambiguity` is not an entry (N2: no lane selects user-story-ac).

[question."repro.cannot-reproduce"]
text = "The report could not be reproduced. Close as cannot-reproduce, or supply more information?"
options = ["supply-info", "close-cannot-reproduce", "proceed-without-repro"]

[question."root-cause.no-hypothesis"]
text = "No confirmed hypothesis after the loop budget. How should we proceed?"
options = ["provide-hint", "accept-best", "abandon"]

[question."root-cause.accept"]
text = "Accept this root cause as established?"
options = ["accept", "reject-with-note"]

[question."draft.accept"]
text = "Accept this artifact as the basis for the next stage?"
options = ["accept", "changes-requested"]

[question."tdd.green-exhausted"]
text = "Implementation did not reach green within the loop budget."
options = ["provide-hint", "reduce-scope", "abandon"]

[question."confirmation.not-fixed"]
text = "The original reproduction still fails after the change. Send back to implement, or reopen the analysis?"
options = ["send-back", "reopen-analysis"]

[question."scan.accept-findings"]
text = "The scan reports critical or high findings. Accept them with a recorded exception, or send the change back?"
options = ["accept-exception", "send-back"]

[question."review.blocking"]
text = "Blocking findings exist. Override and approve, or send back?"
options = ["send-back", "override-approve"]

[question."closure.signoff"]
text = "Every acceptance criterion is covered, the tree is clean and links are reconciled. Close this item?"
options = ["close", "hold"]

[question."facet.change"]
text = "No changeset exists yet, so the change deriver abstained. What kind of change is this item?"
options = ["text", "binary", "generated"]
binds = ["unknown_facet:change"]

# (dated 2026-09-29, s8g build, package S8G-P6-MUTATION-RESUME-DRIFT; s8g section 8g.6; R1 = ADR-0191 decision 10,
# proposed.) The eleventh: AC-357's question, declared once here in the file s8d's R5 fixes. No catalog step opens it:
# the kernel mints the gate (rk_kernel::verify::ac_gate, kind = this id) when the verify pass's stage exit is refused,
# for the first criterion neither pinned nor answered. Only `discriminates` is an answer the AC ledger reads
# (human_answered); `does-not-discriminate` leaves the criterion unpinned and holds it by name. Its text is not taken
# from spikes/p9, which declares no such question.
[question."verify.ac-discriminates"]
text = "No executable mutation pins this acceptance criterion. Does the named assertion discriminate it?"
options = ["discriminates", "does-not-discriminate"]

# (dated 2026-10-18, s8j build, package S8J-C2-ROOT-QUESTIONS; s8j section 8j.2; ADR-0200 decisions 1 and 2,
# proposed.) The twelfth and thirteenth: the human roots, one question per `source = "human"` kind the lanes demand
# (D21-41 (f): "supplied through a pack-declared gate question whose option attaches the kind"). No catalog step asks
# either: the kernel opens `human_root:<Kind>` when selection's step 4 finds no admissible producer for a human kind,
# and each question answers its own gate through `binds`. Each one option admits only its own kind, so an answer can
# store only the root its gate asked for (ADR-0129 decision 4). Their texts are ADR-0200's, not taken from spikes/p9.
[question."root.bug-report"]
text = "No activity produces a BugReport: a person supplies it. Attach the bug report the work starts from."
options = [{ id = "attach", attaches = "BugReport" }]
binds = ["human_root:BugReport"]

[question."root.intake-record"]
text = "No activity produces an IntakeRecord: a person supplies it. Attach the intake record the work starts from."
options = [{ id = "attach", attaches = "IntakeRecord" }]
binds = ["human_root:IntakeRecord"]
