# Step 8 criterion (1), AC-473: the fix-lane self-hosting item, minted again for the same real defect.
# *(dated 2026-11-08, s8's route back after a failed first real run: runbook/phase-1/s8-exit-criterion.md,
# "After a failed first real run of the fix item", step 4; D21-163; D21-174 item 5.)*
