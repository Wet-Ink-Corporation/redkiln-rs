# non-integer margin produces no finding, while the run's loader refuses the same pack. AC-377 asks that `redkiln
# doctor` reach the same verdict as the load. 🛑 Its `reserved-fix-item:` ledger line is the operator's, and it
# forbids fixing the defect by hand or in any stage before `s8`: the lane fixes it. Its BugReport and repro pair are
# `.redkiln/intake/rk-fix-doctor-margin-2.*`, copies of the first item's.
