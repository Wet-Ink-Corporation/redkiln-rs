# The fields are the first item's (s8j section 8j.5). `kind = "bug"` derives the lane as `fix` -> pack
# `bug-standard`. `hold_before = "specification"` is the boundary hold. `slice` is the id without its `rk-fix-`
# prefix (s8e section 8e.8). `[trial] activity` is ADR-0195 decision 4's spelling. `cos = "standard"` is read by
# `bug-standard`'s `applies`.
