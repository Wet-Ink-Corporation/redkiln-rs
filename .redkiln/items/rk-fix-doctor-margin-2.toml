# The first item, `rk-fix-doctor-margin`, stopped at relaunch 3 (rc 14, D21-174). Its run is to be archived at
# `refs/archive/s8-failed-2026-11-08/rk-fix-doctor-margin` (D21-163 steps 2-3, the operator's) and never resumed. This item is the same defect under a
# new id, so the old run's store rows and archived `Story:` marks, which are keyed to the old id, do not touch this
