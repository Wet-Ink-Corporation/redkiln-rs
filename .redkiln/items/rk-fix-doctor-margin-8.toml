# Step 8 criterion (1), AC-473: the fix-lane self-hosting item, minted an eighth time for the same real defect.
# *(dated 2026-11-18, s8's route back after a failed first real run: runbook/phase-1/s8-exit-criterion.md,
# "After a failed first real run of the fix item", step 4; D21-163; D21-183.)*
#
# The seventh item, `rk-fix-doctor-margin-7`, passed analysis, the (3) kill, specification, design, planning and
# implement, and had AC-1 to AC-3 answered in verify, then stopped twice with rc 14: the verify pass's whole suite ran
# red on 2 or 3 tests that spawn `redkiln run` over the fixture child and outlived the test suite's 30 s spawn bound
# under full-suite load (D21-183 states a longer bound for those spawns). Its run is to be archived at
# `refs/archive/s8-failed-2026-11-08g/rk-fix-doctor-margin-7` (restart steps 2-3, the operator's) and never resumed.
# This item is the same defect under a new id: `rk-cli` `doctor::rules::margin` (`RK-D-MARGIN`). A pack with no
# `[margins]`, with a window missing, or with a non-integer margin produces no finding, while the run's loader
# refuses the same pack. AC-377 asks that `redkiln doctor` reach the same verdict as the load. 🛑 Its
# `reserved-fix-item:` ledger line is the operator's, and it forbids fixing the defect by hand or in any stage
# before `s8`: the lane fixes it. Its BugReport and repro pair are `.redkiln/intake/rk-fix-doctor-margin-8.*`: the
# seventh item's, unchanged but for the id.
#
# The fields are the seventh item's (s8j section 8j.5). `kind = "bug"` derives the lane as `fix` -> pack
# `bug-standard`. `has_repro = true` is kept, so implement selects `repro-green-refactor@1` (Invariant 1).
# `hold_before = "specification"` is the boundary hold. `slice` is the id without its `rk-fix-` prefix (s8e
# section 8e.8). `[trial] activity` is ADR-0195 decision 4's spelling. `cos = "standard"` is read by
# `bug-standard`'s `applies`.
# *(dated 2026-11-28, D21-163 step 4; D21-184)* Superseded by rk-fix-doctor-margin-9; to be archived at refs/archive/s8-failed-2026-11-08h/ and <gcd>/redkiln/archive/2026-11-08h-rk-fix-doctor-margin-8/ (restart steps 2-3, the operator's).
