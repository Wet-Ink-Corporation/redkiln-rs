# Artifact-kind registry (schema §9c amendments 27 and 43; proposal §2.1). One table per kind.
# source = "human"  → a root: no producer anywhere; supplied at intake or pasted (PC3, derived_from = []).
# source = "activity" → some catalog activity provides it (lattice.py --validate checks this).
# keyed_by = "toolchain" → a required instance per element of the item's toolchain set (amendment 43).
# schema = the value schema (schemas.toml) the artifact's body is typed by; lint checks composing emits against it.
# Added 2026-09-08 from the catalog/pack inventory (75 kinds) + SessionNotes (gate attachment) + ProfileReport (PC7).

