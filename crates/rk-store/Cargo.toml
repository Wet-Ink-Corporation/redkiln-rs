[package]
name = "rk-store"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Same contract as the other members: corpus-bound tests compile behind this feature and run as
# `cargo test --workspace --features corpus` on a box holding redkiln-corpus at CORPUS_PIN.
corpus = []

[dependencies]
rk-types = { path = "../rk-types" }
serde.workspace = true
serde_json.workspace = true

# `bundled` compiles SQLite from the vendored amalgamation rather than linking a system library.
#
# Why it is declared HERE. ADR-0105 clause 7 gives *rk-store* the connection contract -- busy_timeout,
# one writer behind a mutex, readers per thread, WAL, and `doctor`'s network-filesystem refusal --
# and a contract that cannot open a connection cannot be tested.
#
# NO ADR IS CONTRADICTED, and an earlier revision of this comment overstated that.
# *(Corrected 2026-09-13.)* It claimed a "recorded divergence" from ADR-0084's wording and said an
# erratum was owed. Read against the record, neither holds. ADR-0084's Decision says "the EventStore
# adapter opens with the `bundled` feature", which it still will; nothing there says only the adapter
# may declare it, and no forbids bullet in ADR-0084 or ADR-0100 scopes `rusqlite` to a crate --
# unlike the YAML rule, which does exactly that for `redkiln-migrate`. Cargo feature unification
# means the resolved graph and the built artifact are identical whichever member declares it.
#
# What WAS contradicted is design §9.2's crate column, which read `rk-adapter-sqlite` only. That is
# the design, not a frozen record, and it was amended with a dated note rather than errata'd.
#
# Non-bundled is not an option on this box or on `windows-latest`: neither provides a system sqlite3
# or SQLITE3_LIB_DIR. The cost is a C compile on every clean build and on both CI targets, which
# ADR-0084 already records as a negative.
rusqlite = { workspace = true, features = ["bundled"] }

[dev-dependencies]
rk-types = { path = "../rk-types" }
serde_json.workspace = true
tempfile = "3"
trybuild.workspace = true

# ONE integration binary, `tests/it/main.rs` with a `mod` per case (ADR-0083).
[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
