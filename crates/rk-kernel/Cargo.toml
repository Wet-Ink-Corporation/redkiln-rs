[package]
name = "rk-kernel"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Same contract as the other four members: corpus-bound tests compile behind this feature and run
# as `cargo test --workspace --features corpus` on a box holding redkiln-corpus at CORPUS_PIN.
#
# Declared EMPTY, and deliberately: the feature must EXIST or a `--features corpus` invocation
# naming this package exits 101 with "none of the selected packages contains these features", and
# Checkpoint 6 runs `cargo test --workspace --features corpus`. The reason is written out in full
# at crates/rk-types/Cargo.toml:10-17. It stays `[]` even once this crate HAS corpus-bound tests,
# because it gates code through `#[cfg(feature = "corpus")]`, which needs no feature entry --
# crates/rk-git/Cargo.toml declares `corpus = []` while three tests sit behind
# `#![cfg(feature = "corpus")]` in crates/rk-git/tests/it/corpus_f12.rs, and that is the house form.
corpus = []

# THE DETERMINISM GATE'S POSITIVE CONTROL (AC-001-AC-004; s7b §7b.5). A non-default feature OF THIS
# CRATE that reintroduces exactly one banned determinism call inside `rk-kernel::workflow`, so a
# WORKSPACE-scoped clippy selects it:
#
#   green:  cargo clippy --workspace --all-targets
#   RED:    cargo clippy --workspace --all-targets --features rk-kernel/workflow-clock-reintroduce
#
# It is COMMITTED, not reverted (the tests/fixtures/rk-clock-read/ precedent, DECISIONS-2026-09-12
# E4): a reverted observation is not an assertion, and the `#[deny]` grep in Checkpoint 7b has no
# other way to show the attribute BITES rather than merely being declared. Do NOT reach for
# `-p rk-kernel --features rk-clock-read/reintroduce`: that is ANOTHER member's feature and the
# invocation errors rather than lints (s5:168-169).
workflow-clock-reintroduce = []

# THE INHERITANCE CONTROL (AC-001-AC-004; design C §1.1). ADDED 2026-09-14, Slice 4e, and it is a
# DIFFERENT PROPOSITION from `workflow-clock-reintroduce` directly above rather than a duplicate of
# it. That one reintroduces the banned call in `src/workflow.rs` -- the file that CARRIES the
# `#![deny(clippy::disallowed_methods)]`. This one reintroduces it in a CHILD module,
# `src/workflow/fsm.rs`, which carries no attribute of its own:
#
#   green:  cargo clippy --workspace --all-targets
#   RED:    cargo clippy --workspace --all-targets --features rk-kernel/workflow-fsm-clock-reintroduce
#
# Every module added since Slice 4a -- budget, envelope, retry, breaker, degrade and now fsm -- is a
# child of `workflow` and relies on lint levels propagating DOWN the module tree. Nothing in the tree
# demonstrated that propagation; each of those modules' headers asserts it in prose. This feature is
# the one thing that shows it. COMMITTED rather than observed and reverted
# (DECISIONS-2026-09-12 E4). **No Checkpoint 7b line runs it**: :1396-1398 names only
# `workflow-clock-reintroduce`, so this control's result is reported in the slice record and is never
# claimed as a checkpoint pass. An owed §7b.14 line is recorded with it.
workflow-fsm-clock-reintroduce = []

# THE SELECTION PURITY GATE'S POSITIVE CONTROL (AC-041; s7b §7b.9(2)). The same shape and the same
# warrant as `workflow-clock-reintroduce` directly above, pointed at `rk-kernel::select`:
#
#   green:  cargo clippy --workspace --all-targets
#   RED:    cargo clippy --workspace --all-targets --features rk-kernel/select-clock-reintroduce
#
# It exists because AC-041 is a NEGATIVE criterion -- *"the hidden input must become impossible, not
# merely absent"* -- and a module-level `#[deny(clippy::disallowed_methods)]` that is merely
# DECLARED is indistinguishable from one that BITES. This feature is the only thing in the tree that
# tells the two apart for `select`, and it is COMMITTED rather than reverted (DECISIONS-2026-09-12
# E4: a reverted observation is not an assertion).
select-clock-reintroduce = []

# THE ADAPTER-EDGE GATE'S POSITIVE CONTROL (AC-484; D-1, 2026-09-14). The same warrant as the three
# features above -- a rule that has never been seen to FIRE is indistinguishable from one that
# cannot -- pointed at this crate's dependency GRAPH rather than at its source:
#
#   green:  cargo metadata                                               -> no rk-adapter-* in this crate's RESOLVED graph
#   RED:    cargo metadata --features rk-kernel/adapter-edge-reintroduce -> the assertion fails NAMING rk-adapter-sqlite
#
# UNLIKE THE THREE CLOCK FEATURES ABOVE, THIS ONE TURNS NO GATE RED, and that is a property of the
# instrument rather than a weakness. Those three reintroduce a banned METHOD, which clippy sees, so
# a workspace-scoped clippy run flips to rc=101. AC-484 is a DEPENDENCY-GRAPH property, which clippy
# does not read and which cargo-deny cannot express either (its bans are workspace-wide, while
# AC-484 is a per-crate edge -- see the OWED erratum in tests/it/adapter_edge.rs). Measured
# 2026-09-14: cargo clippy --workspace --all-targets --features rk-kernel/adapter-edge-reintroduce
# exits 0, where the other three exit 101. The must-fail half is therefore driven BY THE TEST, which
# spawns cargo metadata both ways and asserts the violation appears in one and not the other.
#
# It is COMMITTED, not made and reverted (DECISIONS-2026-09-12 E4). AC-484's Verified-by asks for
# "a fixture commit adding `rk-adapter-sqlite` to `rk-kernel` that must fail", and a commit that is
# reverted proves nothing after the revert; the feature is the permanent, always-checkable form of
# it. Both halves run inside `ac484_adapter_edge_fixture`
# (crates/rk-kernel/tests/it/adapter_edge.rs).
#
# 🛑 THE ASSERTION IS OVER `resolve.nodes[]`, NEVER OVER `packages[].dependencies[]`. Because the
# edge below is OPTIONAL, the manifest view lists it whether or not this feature is on -- so a check
# written over `packages[]` would report a violation on a green tree and would be deleted rather
# than fixed. `crates/rk-kernel/src/adapter_edge.rs` reads `resolve` and offers the manifest reading
# only so the test can assert the two DISAGREE.
adapter-edge-reintroduce = ["dep:rk-adapter-sqlite"]

[dependencies]
# ALL FOUR ARE NOW CALLED, as of Slice 4h (2026-09-14). The paragraph that stood here said "ONE OF
# THE FOUR IS STILL DECLARED AND NOT YET CALLED", and named the site its call would land at:
# "Where `rk-ports` will first be USED: the kernel runtime boundary that appends what `select`
# RETURNS (Slice 4, s7b §7b.10 -- ADR-0119 clause 5, ADR-0120 clause 4 and AC-525's 2026-09-13
# amendment all put the append OUTSIDE the pure function). Delete that line when its call site
# lands." **That call site is `src/runtime.rs` and this is the deletion it asked for.** The
# boundary binds `rk_ports::root::Ports`, dispatches through `Harness`, appends through
# `EventStore`, and holds the store as `Arc<Mutex<dyn EventStore>>` per ADR-0115 clause 1.
#
# What has NOT changed is what a declared edge proves: AC-483's half is discharged by a manifest
# line and a `cargo tree` edge and never by a call, and that stays true now that the call exists.
# THREE WERE ALREADY CALLED as of Slice 3: `rk-store` -- `rk_store::canon` is the
# canonical serialiser every byte-identity comparison in `select` runs through, at
# `src/select/canonical.rs`; `rk-types`, for `digest::{Digest, sha256, sha256_lp}`, the one hash
# ADR-0116 clause 6 admits, at the same file; and `rk-git`, at `src/replay.rs` -- the replay is
# handed an `rk_git::gitops::GitOps` in `Mode::Replay` and AC-006's *"zero rk-git writes"* is read
# off ITS OWN `writes_performed()` counter (ADR-0105 decision 1). That last edge was declared and
# uncalled until 2026-09-13, while the replay counted a `GitWriter` trait the kernel had declared
# for itself on the FALSE warrant that `rk-git` "exposes no port to bind a fake to" --
# `crates/rk-git/src/gitops.rs`:44-51 ships `VecJournal`, described in its own header as *"the fake,
# and what the replay tests drive"*.
#
# `rk-ports`' edge was here BEFORE its call site, and would still belong here without one: it is the
# SUBJECT of criteria -- as is `rk-git`'s, whose AC-483 half is *"`rk-kernel` depends on `rk-git` as
# a concrete crate"*, and AC-484/AC-528 are assertions about this graph's shape -- so removing it
# would delete the thing under test.
rk-types = { path = "../rk-types" }
rk-ports = { path = "../rk-ports" }
# THE CANONICAL-SERIALISER EDGE, taken by the operator's decision of 2026-09-13 (D3) and NOT taken
# silently at a manifest line. §7b.9(2) framed the layering as a two-way question -- either
# `rk-kernel` depends on `rk-store` for `rk_store::canon`, or `canon` MOVES to `rk-types` beside
# `digest`. **Option A was chosen: the dependency.** The canonical FORM is not invented here; it is
# already forced by `crates/rk-store/src/canon.rs` (*"object keys sorted byte-wise, LF only, no
# trailing newline, floats refused"*), which ADR-0097 decision 2 component 4 already names for step
# inputs and which AC-040's byte-identity is measured under. Writing a second one in this crate is
# what the edge exists to prevent: `serde_json` carries `preserve_order` WORKSPACE-WIDE (root
# `Cargo.toml`:44), so a plain `to_vec` over an insertion-ordered map leaks construction order into
# AC-040's assertion and can still pass its 100 shuffled repetitions.
#
# **Nothing is superseded and no checkpoint is disturbed.** The MOVE option would have edited
# `rk-types` (Checkpoint 5, `96ba9c2`) and `rk-store` (Checkpoint 6, `ea83eac`) after they passed,
# and `00-preamble.md`:232-237 would then have made both rows provisional. Taking the dependency
# edits neither crate, so neither row moves.
#
# **The cost, measured and stated rather than discovered later:** `rk-store` declares
# `rusqlite = { features = ["bundled"] }`, so `rusqlite`, `libsqlite3-sys` and a C compile enter
# `rk-kernel`'s RESOLVED graph and appear in `cargo tree -p rk-kernel -e normal`. Neither is an
# async runtime (AC-528) nor an `rk-adapter-*` (AC-484), so the two assertions the tree is read for
# are untouched -- but the kernel now builds SQLite, and that is the price of Option A.
rk-store = { path = "../rk-store" }
# A CONCRETE CRATE, not a port, and that is the decision and not an omission (AC-483's second
# clause; ADR-0003:57-58). Trailers, worktrees, disposable clones and reconcile() have measured
# behaviour and no alternative VCS is named, so the git axis fails ADR-0003's own test for a port;
# `rk-ports` declares five ports and no sixth, and its `git_port_is_not_a_port` fixture is what
# refuses the sixth.
rk-git = { path = "../rk-git" }
serde.workspace = true
serde_json.workspace = true
# THE ONE `rk-adapter-*` EDGE THIS CRATE MAY CARRY, AND IT IS OFF (AC-484; D-1, 2026-09-14). It is
# OPTIONAL, so it is selected only by `adapter-edge-reintroduce` above and appears in no default
# build, no default `cargo tree -p rk-kernel -e normal`, and no default `resolve.nodes[]` entry for
# this package. It is the positive control for the paragraph immediately below: without it, "no
# `rk-adapter-*` edge" is a proposition nothing in the tree has ever been seen to falsify.
#
# The target crate is tests/fixtures/rk-adapter-sqlite/ -- a workspace MEMBER with ZERO
# dependencies. Zero is required, not tidy: an optional dependency enters Cargo.lock either way and
# `cargo audit` / `cargo deny` read the lock, and AC-528 forbids an async runtime anywhere in this
# crate's resolved graph. That fixture is NOT the real adapter; Step 7c's will live under `crates/`,
# and this one is renamed or retired then rather than silently shadowed. Its own Cargo.toml says so.
rk-adapter-sqlite = { path = "../../tests/fixtures/rk-adapter-sqlite", optional = true }

# WHAT IS NOT HERE IS THE POINT (AC-528, AC-484; ADR-0076). No async runtime -- `tokio`,
# `async-std`, `futures` or `async-trait` -- directly or transitively, and no `rk-adapter-*` edge,
# directly or transitively. The kernel is the workflow side of the split: every `.await` lives in
# an adapter, and the kernel reaches the world only through `rk-ports`' sync traits. Checkpoint 7b
# asserts this over the RESOLVED graph (`cargo tree -p rk-kernel -e normal`), because this table
# sees direct dependencies only.
#
# **Amended 2026-09-14 (D-1), and the amendment is the second half of that last sentence.** This
# table now DOES carry an `rk-adapter-*` line -- the optional `rk-adapter-sqlite` above -- and the
# sentence about it holds precisely because the reading is the resolved graph: the optional edge is
# absent from `resolve.nodes[]` and from `cargo tree -p rk-kernel -e normal` unless
# `adapter-edge-reintroduce` is selected. It IS present in `cargo metadata`'s
# `packages[].dependencies[]`, which is the manifest view of exactly this table and is therefore the
# reading no assertion may use. `ac484_adapter_edge_fixture` asserts both readings off the same
# bytes so that the difference is a committed test and not a comment.
#
# `rk-store` WAS deliberately absent at Slice 1, and §7b.9(2)'s layering question is settled at
# Slice 3 as option A -- the edge above. See its comment for what was chosen, what it costs and
# what it leaves untouched.

[dev-dependencies]
# Repeated for the integration binary: a crate's own [dependencies] are not in scope inside
# tests/ (crates/rk-types/Cargo.toml:31-32).
rk-types = { path = "../rk-types" }
# AC-040's byte-identity assertion compares `rk_store::canon::canonical` output, so the integration
# binary needs the same edge the library took above.
rk-store = { path = "../rk-store" }
# ADDED 2026-09-14 (Slice 4c), for AC-464's REFUSAL half and for nothing else. The corpus-gated
# `inner_retry_ac026_at_the_corpus_pin` reads AC-026's rows from `$CORPUS_REPO/results/` at the pin,
# and `crates/rk-git/tests/it/corpus_f12.rs`:72-96 is the house rule for that read: refuse BEFORE any
# read if the corpus checkout is not at `CORPUS_SHA` or is dirty. `rk_git::git_exec::run` is the one
# wrapper `std::process::Command` is allowed behind (it is in `clippy.toml`'s `disallowed-types` and
# `rk-git` carries the `#[expect]`), so the check cannot be written in this crate without this line.
#
# **The resolved graph does not move**: `rk-git` is already a normal dependency of this crate above,
# so `cargo tree -p rk-kernel -e normal` is unchanged and AC-484/AC-528's assertions read the same
# graph. It is not an async runtime and it is not an `rk-adapter-*`.
rk-git = { path = "../rk-git" }
serde_json.workspace = true
# ADDED 2026-09-17 (Step 7b-ii, the human gate). AC-245's property test drives `rk_git::tree::tree_hash`
# over a REAL repository built at test time -- a git repo cannot be a committed fixture -- and the
# repository has to live somewhere that is deleted with the test. Same crate, same version spec as
# crates/rk-git/Cargo.toml:37, the one other place in the workspace that builds repos in tests, so the
# resolved graph gains no new crate: `tempfile 3` is already in Cargo.lock through rk-git's dev-deps.
tempfile = "3"
# ADDED 2026-09-17 (Step 7b-ii, the review gate): AC-286's and AC-296's named instrument. Dev-only.
proptest.workspace = true
# The compile-fail harness. Its cases' instrument is a compile FAILURE, which only a must-fail
# harness can observe, and each case commits a .stderr snapshot so a case that starts failing for a
# DIFFERENT reason goes red (s7a §7a.8).
trybuild.workspace = true

# ONE integration binary, `tests/it/main.rs` with a `mod` per case, never one file per case
# (ADR-0083:74). This is also what makes `--test it` addressable in Checkpoint 7b.
[[test]]
name = "it"
path = "tests/it/main.rs"

# `workspace = true` AND NOTHING ELSE (ADR-0102 decision 2; Cargo rejects a mixed [lints] table --
# RFC 3389, cargo #13157, PIA-026). THIS LINE IS LOAD-BEARING AND IS NOT COSMETIC: `clippy.toml`
# CONFIGURES `disallowed_methods`, it does not raise its level, and `clippy::disallowed_methods` is
# warn-by-default. The level comes from the root Cargo.toml's `[workspace.lints.clippy] all =
# { level = "deny", priority = -1 }`, which a member reaches only through this table. Without it
# EVERY lint assertion in Checkpoint 7b passes over an unlinted crate
# (tests/fixtures/rk-clock-read/Cargo.toml:21-24 says so in terms).
[lints]
workspace = true
