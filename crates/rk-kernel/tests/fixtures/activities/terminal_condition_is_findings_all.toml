# AC-527, must-FAIL fixture 2 — **recast 2026-09-25 (s8b §8b.4, D21-41 (h), D21-55)**: THE WITNESS ALONE.
#
# It reads "every finding this reviewer raised is outside the blocking classes", which one
# `Reproduced` finding falsifies. It carries no `none(` quantifier at all, so neither a string match
# nor a match on the quantifier can catch it: only evaluating it over a single-class blocking witness
# does. ADR-0080's own spelling does not occur anywhere in this file, and the test asserts that over
# these very bytes.
#
# Before the recast this fixture was `findings.all(severity != 'blocking')`. That is a severity-only
# predicate, the same shape as `terminal_condition_is_severity_only.toml`, which the amended rule
# LOADS, because it reads no `evidence`. So the old fixture 2 could no longer be red.
# (dated 2026-09-25, s8b refuting round 5: the paraphrase "d2's bullet 1 is a threshold over
# severity" is dropped. d2 bullet 1 reads "no finding at or above threshold T survives
# re-execution", in d2's "a threshold over severity or confidence"; whether a severity-only row
# without re-execution conforms to it is OPEN, D21-57.)

[activity]
id           = "ac527-all-over-empty"
version      = 1
stage        = "build"
provides     = ["ReviewNote"]
requires     = ["Diff"]
tags         = ["kind:bug"]
method_rank  = 20
family       = "ac527-fixtures"
min_rigor    = "optional"
cost_class   = "S"
evidence     = ["Findings?"]

[[step]]
id      = "draft"
kind    = "agent"
role    = "author"
inputs  = { diff = "artifact:Diff" }
outputs = "value:ReviewDraft"

[[step]]
id      = "adversary"
kind    = "agent"
role    = "reviewer"
when    = "rigor >= recommended"
inputs  = { draft = "${draft.outputs}" }
outputs = "value:Findings"

# THE TERMINAL CONDITION.
[[step]]
id       = "policy"
kind     = "check"
inputs   = { findings = "${adversary.outputs?}" }
expr     = "findings.all(not (evidence in ['Reproduced', 'MutationSurvived']))"
on_false = { to = "draft", max = 2 }

[[step]]
id        = "emit"
kind      = "emit"
artifacts = { ReviewNote = "${draft.outputs.note}" }
evidence  = ["${adversary?}"]
