# The lattice fixtures' artifact-kind registry. One human-sourced root so the registry is never
# empty; every other kind is activity-sourced.

[artifact.IntakeRecord]
source = "human"

[artifact.Spec]
source = "activity"

[artifact.Patch]
source = "activity"

[artifact.TestResult]
source = "activity"

[artifact.ThreatModel]
source = "activity"

[artifact.KindX]
source = "activity"

[artifact.KindY]
source = "activity"

[artifact.Orphan]
source = "activity"

# report-branches (D21-67 ruling 6, added 2026-09-29 at s8g): its six kinds; KeyedGap and Chain are
# keyed by toolchain, so the keyed render and the transitive entry are reachable.
[artifact.Base]
source = "activity"

[artifact.WrongStage]
source = "activity"

[artifact.KeyedGap]
source = "activity"
keyed_by = "toolchain"

[artifact.ForbiddenOnly]
source = "activity"

[artifact.Chain]
source = "activity"
keyed_by = "toolchain"

[artifact.Missing]
source = "activity"
