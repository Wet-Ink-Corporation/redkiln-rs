# 🛑 THIS IS THE FIXTURE THE REGISTER FORECLOSES DELETING. F39 scored arm D over 140 truth cells at
# pin 47faec9f, so this clause is DISCHARGED FOR ARM D -- and "a discharged clause is not a partial
# unblocking, and the five-case fixture set stays at five" (AC-071's own dated note). A discharged
# clause makes a loose implementation CHEAPER to rationalise, not less costly, which is why the
# negative stays: the lint must still be able to fail on it for a record that carries any other
# verdict.
#
# `unrun` rather than a typo of `scored`: the register's clause is `rec.panel_verdict == "scored"`,
# and the failure this pins is a record whose panel half was never adjudicated at all.

