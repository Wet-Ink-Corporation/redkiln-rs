# AC-345 / AC-346 — the two-AC fixture spec. One AC whose declared mutation flips its named
# assertion (pinned), one whose mutant survives the suite (mutation-survived). The runs are scripted
# by the test; this file declares what the author declared (ADR-0104 decision 1).

[[ac]]
id = "AC-346-A"
verification = "test/implement-contract.test.ts::orders the plan steps"

[ac.assertion]
file = "test/implement-contract.test.ts"
test = "orders the plan steps"
assertion = "expect(order).toEqual(['plan', 'implement', 'record-links'])"

[ac.mutation]
patch = "--- a/workflows/forge-implement.js\n+++ b/workflows/forge-implement.js\n@@ -1 +1 @@\n-const ORDER = ['plan', 'implement', 'record-links'];\n+const ORDER = ['record-links', 'plan', 'implement'];\n"
suite = "npx vitest run test/implement-contract.test.ts"

[[ac]]
id = "AC-346-B"
verification = "test/implement-contract.test.ts::AC-015 record-links after the commit"

[ac.assertion]
file = "test/implement-contract.test.ts"
test = "AC-015 record-links after the commit"
assertion = "expect(commitStep.toLowerCase()).toMatch(/after[^.]{0,40}commit/)"

[ac.mutation]
patch = "--- a/workflows/forge-implement.js\n+++ b/workflows/forge-implement.js\n@@ -1800 +1800 @@\n-immediately AFTER the commit exists\n+as the FIRST thing you do, before you make the checkpoint at all\n"
suite = "npx vitest run test/implement-contract.test.ts"
