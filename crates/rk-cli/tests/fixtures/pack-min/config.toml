# The §7d.9 scaffold bytes, plus the two keys a fixture repository needs.
#
# `harness_binary` is a real `Adapters` member (RT-49) and a key on the AC-474 key surface — NOT a
# toggle. The fixture child's MODE travels in the child ENVIRONMENT the test spawns `redkiln` with
# (`RK_FIXTURE_MODE`, `RK_FIXTURE_MARKER_DIR`, via `Command::env`), never through `set_var` and never
# through a key that changes the product's code path.
#
# `[packs] enabled` carries ADR-0128 decision 3's two lane names, because `pack.toml` is installed
# twice under exactly those.

[adapters]
harness = "rk-adapter-claude"
store = "rk-adapter-sqlite"
toolchains = ["rk-adapter-toolchain-node", "rk-adapter-toolchain-rust"]
harness_binary = "rk-fixture-child-claude"

[packs]
enabled = ["bug-standard", "story"]

[doctor]
unread_window_runs = 50

# *(dated 2026-09-28, `s8e` build, package S8E-P2; `s8e` §8e.11.)* ADR-0159: the `<project>`
# component of every trailer value. Entry mints a `Story:` mark once `s8e` §8e.6 lands, and
# ADR-0159 decision 2 refuses that mint by name without this key, so every binary fixture that
# runs a stage (AC-438's table, `cost`'s run, `exit/findings-block/`) would move its exit to `3`.
# It contains no `/` and equals no item id, slice or stage in this corpus.
[project]
name = "rk-fixture"
