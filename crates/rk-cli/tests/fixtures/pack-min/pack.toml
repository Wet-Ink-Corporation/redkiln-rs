# The smallest loadable process pack (`s7d` §7d.13). Installed as BOTH
# `.redkiln/packs/bug-standard.toml` and `.redkiln/packs/story.toml` — ADR-0128 decision 3's two lane
# names, one file.
#
# Read by TWO parsers over these same bytes: the kernel's `Pack::from_toml` (a TOML subset walker
# that ignores keys it does not know) and `rk-cli`'s own `PackExtras`. The kernel's `Pack` is NOT
# widened for the adapter-facing keys below; doing so would re-open Checkpoint 7b for a fixture.
# 🛑 A ROOT KEY, AND IT SITS ABOVE EVERY TABLE HEADER BECAUSE TOML REQUIRES THAT.
# A bare key belongs to the LAST table opened, so this line below `[role.implementer]` became
# that table's field and `PackExtras` reported `missing field gate_deadline_secs` at the
# document root. §7d.5 step (9): the gate deadline is `now + this`, off the ONE wall-clock read.
gate_deadline_secs = 900

[pack]
id = "pack-min"
applies = "kind == bug or kind == story"
# (dated 2026-10-02, s8h build, package P5-kernel-envelope) `dispatches`: the per-item dispatch cap
# `replay::resume_routed` now requires beside `tokens` (Record B = ADR-0198 decision 4, proposed),
# the installed packs' 40.
appetite = { points = 50, tokens = 200000, dispatches = 40 }

# AC-029: DECLARED, never defaulted in code. `replay`'s loop calls `require_attempt_cap` BEFORE it
# dispatches and refuses a pack that declares none. It is 1 so a one-element `FakeHarness` script is
# never exhausted into `Transport { detail: "script exhausted" }` — §7d.5's own reason.
[retry]
attempts_cap = 1

[breaker]
consecutive_platform_failures = 3
expiry_secs = 600

# `discouraged` is RESERVED and refused by `read_rigor`; the five tokens are a closed set.
[policy]
stages = { triage = "mandatory", implement = "recommended", review = "mandatory" }

[stage.implement]
baseline = ["ImplReport"]

# THE ONE `require` ROW, and it reads a NULLABLE BOOLEAN HUMAN-SOURCED facet on purpose.
#
# `gate-item.toml` omits `has_repro`, so the item carries `with_facet_null` for it, the evaluator
# returns `Tri::Null`, and step 2 mints exactly one `GateOpened { reason: UnknownFacet, axis }` —
# the abstention gate, which is the ONLY gate this pack opens. A `StepKind::Gate` step inside an
# activity opens nothing at this pin (the loader maps it to `Evidence::HumanAnswer` and the runtime
# dispatches the whole activity), which is why there is no gate step anywhere in this fixture.
#
# `human` and `nullable` also keep `lint --facet-provenance` off it: a `declared` facet keying a
# require row is `RequireKeyedOnDeclared`, and a lexical `derived` one is barred too.
[[stage.implement.require]]
when = "has_repro"
artifacts = ["TestReport"]

# 🛑 THE TIER HAS EXACTLY ONE SOURCE, AND IT IS THIS TABLE.
# `Binder::bind` refuses a role declaring no model -- "role implementer declares no model — the
# tier is traceable only through the role (AC-212; AC-118)" -- and the CARD may not carry one
# (`ConfigError::TierLeak`). So `model` and `effort` sit here beside the kernel's own `family`,
# read through `PackExtras`. Spellings are `Tier` / `Effort` under `rename_all = "lowercase"`.
[role.implementer]
family = "claude"
model = "sonnet"
effort = "medium"

# --- read by rk-cli's PackExtras; the kernel's toml_subset walker ignores every key below ---

# `rk_adapter_claude::config::Margins` — BOTH members required, `deny_unknown_fields`, in TICKS.
# AC-377: never a code default.
[margins]
five_hour = 10
seven_day = 10

# Both TTLs — CLAUDE_CODE_PROMPT_CACHE_TTL and CLAUDE_CODE_SUBAGENT_PROMPT_CACHE_TTL.
[cache]
prompt_ttl = "1h"
subagent_prompt_ttl = "1h"

# The gate-class expiry row, linted by `gate::lint_expiry_policy_row`.
#
# 🛑 THE CLASS IS THE FULL GATE KIND, AXIS AND ALL, AND IT IS A **VALUE** RATHER THAN A KEY.
# `fsm::next_action` spells the class `format!("{}:{}", gate.reason.as_str(), gate.axis)`, so the
# abstention gate this pack opens has kind `unknown_facet:has_repro`. A row keyed on the bare
# `unknown_facet` matches NO gate this system opens.
#
# But the full kind carries a COLON, and a TOML key carrying one must be quoted -- which the
# kernel's `toml_subset` walker refuses outright: "bare unquoted keys only, and this one is
# \"unknown_facet:has_repro\"" (crates/rk-kernel/src/toml_subset.rs). TWO parsers read these same
# bytes, so a key shape only one of them accepts is available to NEITHER. Carrying the class as a
# VALUE in an array of tables keeps every key bare and keeps the class exactly the string
# `GateRecord::kind()` produces.
#
# Invisible until this cycle: at cycle 4 the pack was READ at step (7) but never PARSED -- the
# kernel sees these bytes first at `inputs.build()`, which is step (8)/(9)'s.
#
# `fail` is the only action of the three needing no second value, which keeps the expiry
# deterministic for `ac257_…`. `escalate` on the escalation class is refused by the lint itself.
[[gate_expiry]]
class = "unknown_facet:has_repro"
action = "fail"

# (dated 2026-10-02, s8h build, package P7-cli-binding-data-and-amendments) ADR-0146's load-time
# lint (s8h §8h.10; Record B = ADR-0198 decision 7, proposed): `run` and `answer` refuse a
# reachable gate class of the enabled pack with no row. Every pack reaches `escalation`
# (gate::ESCALATION_CLASS) and the three kernel-minted kinds, read by the lint from their
# constants: tier_one::LANDING_REFUSED_KIND, fsm::DRIFT_GATE_KIND, verify::ac_gate::AC_GATE_KIND.
# Each is drafted `fail`, as the installed packs' rows are.
[[gate_expiry]]
class = "escalation"
action = "fail"

[[gate_expiry]]
class = "landing.refused-path"
action = "fail"

[[gate_expiry]]
class = "render.structured-drift"
action = "fail"

[[gate_expiry]]
class = "verify.ac-discriminates"
action = "fail"

# (dated 2026-10-14, s8i build, S8I-E2-EXPIRY-POLICY; operator ruling R9) A fourth kernel-minted
# kind, gate::GateReason::AutomatedVerdictRefused (ADR-0199 decision 3, proposed), is reachable
# in every pack, so the lint requires its row here too. Drafted `fail`, as the installed packs' is.
[[gate_expiry]]
class = "automated-verdict-refused"
action = "fail"

# (dated 2026-10-18, s8j build, S8J-C2-ROOT-QUESTIONS; ADR-0200 decision 3, proposed) The step-4
# gates on the two human roots (workflow::human_root) are kernel-minted kinds reachable in every pack,
# so the lint requires their rows here too. Drafted `fail`, as the installed packs' are.
[[gate_expiry]]
class = "human_root:BugReport"
action = "fail"

[[gate_expiry]]
class = "human_root:IntakeRecord"
action = "fail"

# `timeout_secs` on EVERY activity (`BindRequest.timeout_secs`).
[activity.emit-report]
timeout_secs = 900

# *(dated 2026-10-02, s8h build, package P3-adapter-argv-models; s8h §8h.3; ADR-0197 decision 4, proposed.)*
# THE MODEL TABLE: a role's `model` is a KEY here, and the row's full `id` is what reaches `--model`,
# the `--agents` JSON and the card digest. `Binder::bind` refuses a role whose key is absent.
# haiku: accepts_effort = false is the lifted rule (`tiers.mjs`: EFFORTLESS_TIERS = ['haiku'] --
# "haiku rejects the parameter, so an effort on haiku is a spec error rather than a runtime one").
[models.haiku]
id = "claude-haiku-4-5-20251001"
accepts_effort = false

[models.sonnet]
id = "claude-sonnet-5"
accepts_effort = true

[models.opus]
id = "claude-opus-5-5"
accepts_effort = true
