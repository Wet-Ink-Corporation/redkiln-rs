# The item the REVIEW fixture runs (ADR-0162).
#
# `stage = "review"` is the point: ADR-0156 blocker (4) is that NO shipped item sits at review, so
# the shipped review stage is unreachable for that reason among five others. This fixture supplies
# the one data condition, for the fixture corpus only - it asserts nothing about the shipped tree,
# where `0 of 102` activities still complete a committing walk.
#
# `has_repro` is DECLARED true so the `[[stage.implement.require]]` abstention gate cannot open on
# this item: an `UnknownFacet` gate would end the walk at exit 0 with no dispatch, and the fixture
# would assert a gate rather than a verdict.
#
# *(dated 2026-09-28, `s8e` build, package S8E-P2; `s8e` §8e.11.)* `slice` is the declared slice
# identity `s8e` §8e.8 seals at the review stage's exit outcome. Without it the seal refuses by name
# and `exit/findings-block/`'s exit `4` becomes `3`. It differs from the item id, the project name
# and every stage.
id    = "review-1"
kind  = "bug"
stage = "review"
slice = "review-1-fix"

[facets]
has_repro = true
