# Two roles, and only ONE of them is ambiguous.
#
# `reviewer` is the defect: two cards, SAME selector, so neither is more specific and the
# role resolves to two. `planner` is the CONTROL: two cards at DIFFERENT specificity, so
# the more specific wins and the role resolves. Without the control a rule reading *two or
# more cards* passes this fixture, and AC-416's clause is *two cards at EQUAL selector
# specificity*.

[[card]]
file     = "cards/reviewer-a.json"
fulfils  = ["reviewer"]
selector = "stage:review"

[[card]]
file     = "cards/reviewer-b.json"
fulfils  = ["reviewer"]
selector = "stage:review"

[[card]]
file     = "cards/planner-a.json"
fulfils  = ["planner"]
selector = "stage:plan"

[[card]]
file     = "cards/planner-b.json"
fulfils  = ["planner"]
selector = "stage:plan,kind:bug"
