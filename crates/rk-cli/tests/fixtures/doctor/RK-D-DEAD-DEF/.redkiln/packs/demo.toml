# The fixture's process pack. `.redkiln/packs/<name>.toml` is a FLAT FILE (measured 2026-09-21,
# `crates/rk-cli/src/verbs/run.rs`:553-555), not a directory; the shape follows
# `crates/rk-cli/tests/fixtures/pack-min/pack.toml`, trimmed to what a doctor rule reads.
gate_deadline_secs = 900

[pack]
id = "demo"
applies = "kind == bug or kind == story"
appetite = { points = 50, tokens = 200000 }

[retry]
attempts_cap = 1

[breaker]
consecutive_platform_failures = 3
expiry_secs = 600

[policy]
stages = { triage = "mandatory", implement = "recommended", review = "mandatory" }

[stage.implement]
baseline = ["ImplReport"]

[margins]
five_hour = 10
seven_day = 10

[cache]
prompt_ttl = "1h"
subagent_prompt_ttl = "1h"

# Both catalog activities declare a timeout, so this fixture carries ONLY its own warning.
# Added 2026-09-21 at cycle 10: `ac438_doctor_error_rule_exits_config_error` uses this
# directory as its WARNING-ONLY arm, and RK-D-TIMEOUT was firing here as well, which made
# the arm about an error rather than about a warning.
[activity.emit-report]
timeout_secs = 900

[activity.orphan]
timeout_secs = 900
