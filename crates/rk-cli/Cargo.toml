[package]
name = "rk-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The composition root — the `redkiln` binary (design §9.1; Step 7d)."

[[bin]]
name = "redkiln"
path = "src/main.rs"
# src/lib.rs is the library the tests link (an integration test cannot link a [[bin]] or name a pub(crate) item);
# main.rs only installs the handler and the panic hook and exits through code_for (§7d.10).

# The spawnable fixture child (s7c §7c.17), compiled FROM rk-containment's source file under a THIRD
# target name -- ADDED 2026-09-21 at Step 7d Slice 4 cycle 7, on the precedent rk-adapter-claude's own
# copy states: one bin name in two packages is one output path, cargo warns "output filename
# collision", the two link jobs race and the MSVC linker exits 1104 for both [reproduced 2026-09-17].
# `ac423_probe_is_one_version_spawn_not_a_dispatch` puts it in `harness_binary`'s place and counts the
# marker files it writes, so "exactly one spawn" and the child's argv are FILE facts. Tests reach it
# through env!("CARGO_BIN_EXE_rk-fixture-child-cli"), which cargo sets only for this package's own
# tests -- never through std::env::var or a path under target/.
[[bin]]
name = "rk-fixture-child-cli"
path = "../rk-containment/tests/fixtures/bin/rk-fixture-child.rs"
test = false
bench = false
doc = false

# The review fixture's stub `cargo` (ADR-0162). Reached through
# env!("CARGO_BIN_EXE_rk-fixture-toolchain") and installed into a fixture repository's
# `[adapters] toolchain_programs`, which `src/config.rs` calls "the one way a process-level test
# reaches the fixture child". Its own source says what it is rigged to do and why.
[[bin]]
name = "rk-fixture-toolchain"
path = "tests/fixtures/bin/rk-fixture-toolchain.rs"
test = false
bench = false
doc = false

[features]
# Corpus-bound tests, local-only (AC-464/PIA-002); run as `cargo test --workspace --features corpus`.
corpus = []

[dependencies]
rk-types = { path = "../rk-types" }
rk-ports = { path = "../rk-ports" }
rk-kernel = { path = "../rk-kernel" }
rk-store = { path = "../rk-store" }
rk-git = { path = "../rk-git" }
rk-containment = { path = "../rk-containment" }              # run_bounded for the doctor version probe (D-11)
rk-adapter-claude = { path = "../rk-adapter-claude" }         # the four reals (ADR-0094 d1), constructed once here
rk-adapter-sqlite = { path = "../rk-adapter-sqlite" }
rk-adapter-toolchain-node = { path = "../rk-adapter-toolchain-node" }
rk-adapter-toolchain-rust = { path = "../rk-adapter-toolchain-rust" }
clap.workspace = true
anyhow.workspace = true        # ADR-0102 d6: this crate and redkiln-migrate ONLY
toml.workspace = true          # D18-3: the ConfigFile reader
ctrlc.workspace = true         # D18-2: the signal path, this crate ONLY
serde.workspace = true
serde_json.workspace = true
tempfile = "3"                 # H-3: the bootstrap GitExec's hooks directory, before the common dir is known

[dev-dependencies]
trycmd.workspace = true        # AC-400's --help snapshot
assert_cmd.workspace = true
insta.workspace = true         # the Exit::ALL snapshot
proptest.workspace = true

[[test]]
name = "it"
path = "tests/it/main.rs"

[lints]
workspace = true
