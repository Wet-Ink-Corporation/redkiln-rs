[workspace]
members = ["crates/*", "tests/fixtures/*"]
# Resolver 3, not 2. The MSRV-aware fallback that `rust-version` below exists to arm is resolver 3's;
# under `resolver = "2"` that line is inert and ADR-0102's PIA-027 clause buys nothing. Edition 2024
# defaults to 3, but the workspace root is not an edition consumer, so it must be stated explicitly.
resolver = "3"
# spikes/runner/ was its own package with its own Cargo.toml. Step 2 moved it to redkiln-corpus, so
# that half of this line is now INERT — it is kept because Checkpoint 5 greps the literal string, and
# because the failure it prevents is still live for spikes/s-ports/: cargo walks up from a nested
# package, finds this root, sees that `members` does not cover it, and fails with
#   error: current package believes it's in a workspace when it's not
# — which reads as Halt condition 1 (the rig fails to build) from entirely the wrong direction.
# spikes/s-ports/ is the S-PORTS throwaway crate (F41) and still exists on this tree.
# tests/fixtures/* ARE members (s5 §5.1a): the AC-001–AC-004 and AC-005 must-fail fixture crates.
# Each one's offending call or dependency sits behind a NON-DEFAULT feature, so the default
# `cargo clippy --workspace` and `cargo deny check bans` gates stay green and the fixture is still
# checked by the same invocation with its feature on (DECISIONS-2026-09-12 E4).
exclude = ["spikes/runner", "spikes/s-ports"]

[workspace.package]
edition = "2024"
# Equal to the pin, always (ADR-0102 decision 1): it arms resolver 3's MSRV fallback and `cargo add`'s
# version choice; it is NOT a consumer floor. The pin-bump PR bumps this and rust-toolchain.toml
# together.
rust-version = "1.98.1"
license = "MIT"
publish = false

# ADR-0100 decision 2's pin list lives HERE and nowhere else; members inherit with
# `<dep>.workspace = true` (the form Checkpoint 6 greps for in rk-git).
[workspace.dependencies]
gix        = "=0.87.1"    # exact (ADR-0084, unchanged by ADR-0100); read path only (ADR-0077/0098)
jsonschema = "=0.56.0"    # exact: weekly cadence. Format validation is OPT-IN — call
                          # .should_validate_formats(true) wherever the design relies on format checks
rusqlite   = "=0.40.2"    # exact: carries the one-writer semantics ADR-0105 clause 7 depends on
yaml_serde = "=0.10.7"    # exact; redkiln-migrate ONLY — the one crate that may depend on a YAML reader
# ADDED 2026-09-18 (Step 7c Slice 2, ADR-0127 decision 5): the two binding layers rk-containment's one
# `#![allow(unsafe_code)]` module calls — a Job Object on Windows, a process group on POSIX. Both are 0.x, so
# exact-pinned (ADR-0100 decision 2); both were ALREADY in Cargo.lock at 6152219 as transitive resolutions
# [measured 2026-09-17, ADR-0127 §Evidence], so neither row moves the lock. `nix` is not taken (a second
# binding layer for one `killpg`) and no safe Job Object wrapper crate is (ADR-0099's own ground, kept by 0127).
# windows-sys has NO default features: the member row in crates/rk-containment/Cargo.toml names the ones that
# link, never this row (§7c.19).
windows-sys = "=0.61.2"   # exact: Windows only — CreateJobObjectW, AssignProcessToJobObject, TerminateJobObject, Toolhelp32
libc       = "=0.2.189"   # exact: Unix only — killpg / kill(-pgid, 0) for the process-group arm (ARMED to CI)
chrono     = "^0.4"       # EXEMPT from the 0.x exact-pin rule: de-facto stable, multi-year line, semver discipline
sha2       = "^0.11"      # EXEMPT, same reason
# Any new 0.x dependency is exact-pinned unless its row says why not. A pin bump is a PR that re-runs
# `cargo audit` and `cargo deny` (ADR-0100 decision 2).
#
# Not 0.x, so not on the pin list above, but shared so every member resolves one version:
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }   # preserve_order: AC-158's property
schemars   = { version = "=1.2.2", features = ["preserve_order"] }   # order is otherwise unobservable
insta      = { version = "=1.48.0", features = ["json"] }
# AC-160 and AC-172 are type-level criteria: their instrument is a compile FAILURE, which only a
# must-fail harness can observe. 1.x, so a caret range under ADR-0100 decision 2 rather than a pin.
trybuild   = "1"
# ADDED 2026-09-17 (Step 7b-ii, the review gate): AC-286 ("a `proptest` determinism property") and AC-296 ("a
# `proptest` quantified over every weight × every class") name the crate. 1.x, so the 0.x exact-pin rule does not
# apply; dev-only in rk-kernel. `rand::random`/`thread_rng` stay on clippy.toml's denylist for OUR code; proptest's
# own RNG is seeded and its use is inside the crate, not ours.
proptest   = "1"
# ADDED 2026-09-17 (Step 7c stage-open, s7c §7c.19): ADR-0102 decision 6 puts `thiserror` in every library and
# confines `anyhow` to rk-cli/redkiln-migrate; the five crates 7c adds are the first libraries with error enums
# large enough to want the derive. 2.x, so a caret range under ADR-0100 decision 2 rather than a pin.
thiserror  = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Group entries carry an explicit priority so individual lints below override them (Cargo's
# lint_groups_priority rule — without it `cargo clippy` fails on the pinned toolchain;
# PIA-025 / ADR-0102 decision 4).
all = { level = "deny", priority = -1 }
# An ENUMERATED pedantic subset, never the group: clippy::correctness is the only deny-by-default
# group, and the Clippy Lints book documents pedantic as false-positive-prone and nursery as "new
# lints that are still under development" — so a group deny across a dozen crates is a CI outage
# waiting on the next release (ADR-0102 decision 5).
semicolon_if_nothing_returned      = "deny"
explicit_iter_loop                 = "deny"
match_same_arms                    = "deny"
redundant_closure_for_method_calls = "deny"
items_after_statements             = "deny"
nursery = { level = "warn", priority = -1 }
