# CI — ADR-0083's floor, as ADR-0102 and ADR-0100 correct it.
#
# "A minimal workflow exists from the first commit and runs on every push and pull request... This
# is a floor, not a ceiling — it is specified as the minimum that must never be absent again."
# There was no `.github/` in this repository at all until Step 5; this file is that floor.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS is deliberately NOT set to `-D warnings`: that would promote clippy::nursery to the
  # group deny ADR-0083 forbids. The clippy gate is its exit code (ADR-0102 decision 5, PIA-030).

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # TWO OS targets, and they are not decoration (PIA-031). AC-121's cross-OS half — "the same
        # value rendered twice, on two operating systems... byte-identical, line endings included" —
        # is only checkable if CI runs two targets, and AC-158's property ordering with it. With a
        # single target both are unverified and must be marked so, not assumed.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
        # s8b (D21-47 V2): the frozen p9 tests read `spikes/p9` at P9_PIN from the object store, and a depth-1
        # clone holds no such commit. Whole history, so the pin is present; the helper refuses by name otherwise.
        with:
          fetch-depth: 0

      # NO toolchain action, deliberately. `rust-toolchain.toml` pins an exact channel and rustup
      # honours it on the first cargo invocation, installing the `components` it names. An action
      # taking an explicit `toolchain:` input would be a THIRD copy of the pin — after
      # rust-toolchain.toml and workspace.package.rust-version — and ADR-0102's pin-bump PR moves
      # two lines, not three. One source of truth; `rustup show` makes the resolved version visible
      # in the log so a silent fallback cannot pass unnoticed.
      - name: Show the resolved toolchain
        run: |
          rustup show
          rustc --version
          cargo --version

      # ---- the five gates, none optional (ADR-0083 + ADR-0100 decision 3) ----

      - name: fmt
        run: cargo fmt --all --check

      # Gated on the EXIT CODE, never `-D warnings` — which would promote `clippy::nursery` to the
      # group deny ADR-0083 forbids and ADR-0102 decision 5 restates. Nursery warnings are permitted
      # and are expected to appear in this log (PIA-030).
      - name: clippy
        run: cargo clippy --workspace --all-targets

      # (dated 2026-09-26, s8c build, refuting round 2) moved here from after the P6 lattice step, and pinned. The Rust
      # adapter's sca_scan tests run inside the test step's `cargo test --workspace` and spawn `cargo audit` and
      # `cargo deny` (each reads `cargo <tool> --version` first and refuses on a non-zero exit), so both must be
      # installed before it. The versions are the ones record V (ADR-0170, proposed) measured and the adapter's
      # output readers are written against (cargo-audit 0.22.2, cargo-deny 0.20.2). The audit and deny gates below
      # are unchanged. The step reads `cargo install cargo-audit --locked` / `cargo install cargo-deny --locked`
      # (unpinned, after the test step) until then.
      - name: install audit tooling
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked

      # (dated 2026-10-03, the first windows-latest run) a hosted Windows runner's %TEMP% is the 8.3 short path
      # C:\Users\RUNNER~1\..., while git reports worktrees in the long form C:/Users/runneradmin/...; seven rk-cli
      # tests built expected run-tree paths from the short spelling and missed git's listing on a correct product.
      # rk-cli's temp_repo() now canonicalises its base (the code fix); this points TMP/TEMP at RUNNER_TEMP
      # (D:\a\_temp, no short names) as well, so every other tempdir in the suite is long-form too. Windows only:
      # POSIX temp paths have no 8.3 form. Before the pnpm and nextest steps, so nextest stays immediately
      # before `test` (Checkpoint 8c (2)).
      - name: long-form temp directory (Windows, 8.3)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      # D21-42 14a (s8j §8j.7): the Node toolchain adapter's fixture project needs node_modules before
      # `cargo test --workspace`, or fourteen rk-adapter-toolchain-node tests fail at tests/it/support.rs's
      # preflight (992d257 counted ten; s8c's build, bound, verbs and red_suite tests make it fourteen), as
      # do rk-adapter-toolchain-rust's verbs::setup_installs_each_declared_node_project_offline (which also
      # spawns `pnpm` itself) and rk-cli's verify_pass::node_detected_fixture_records_the_node_adapter.
      # pnpm comes from npm at the version that wrote pnpm-lock.yaml -- no marketplace action -- and
      # --frozen-lockfile makes a lockfile drift fail HERE. Placed BEFORE the nextest install so that step
      # still sits immediately before `test` (Checkpoint 8c (2)); it is still before `test` (Checkpoint 8j (7)).
      - name: node fixture dependencies (pnpm, frozen lockfile)
        shell: bash
        run: |
          node --version
          npm install --global pnpm@10.33.0
          pnpm --version
          pnpm install --frozen-lockfile --dir crates/rk-adapter-toolchain-node/tests/fixtures/project
          test -e crates/rk-adapter-toolchain-node/tests/fixtures/project/node_modules/.bin/vitest \
            || { echo "FAIL: no node_modules/.bin/vitest after pnpm install -- the node suite would fail at its preflight"; exit 1; }

      # s8c (D21-48 X15): cargo-nextest at THE PIN, the version `cargo nextest --version` read on the build box at stage
      # open. It sits immediately BEFORE the test step, because the Rust adapter's nextest-path tests run inside that
      # step's `cargo test --workspace` and spawn `cargo nextest run` against the fixtures. The gate's own command stays
      # `cargo test --workspace`: the runner the adapter selects is the adapter's. A pin bump moves this line, record T's
      # evidence and a new golden under crates/rk-adapter-toolchain-rust/tests/fixtures/nextest/<version>/ in one PR.
      # Checkpoint 8c (2) asserts this step's version and its order.
      - name: install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.146 --locked

      # The corpus-bound suite is NOT here: it reads redkiln-corpus at CORPUS_PIN, which no hosted
      # runner can fetch. It is a local-only suite behind `--features corpus` on a named runner
      # (decision D-N; PIA-002). A corpus-bound test that is not behind the feature fails HERE,
      # which is the point — nothing is silently absent.
      - name: test
        run: cargo test --workspace

      # AC-499's fake half, and the conformance BODIES, live behind `rk-ports`' `conformance` feature since Step 7c
      # Slice 1 (runbook s7c §7c.1 RT-16 as re-amended): `crates/rk-ports/src/conformance.rs` is `#[cfg(feature =
      # "conformance")]` and so is the test binary's `mod conformance;`. Until an adapter's `[dev-dependencies]`
      # edge names the feature (Slice 2 onward, when resolver-3 unification carries it into every test build), the
      # two gates above compile NEITHER the module NOR `port_conformance_fake_rows` -- a test that had been in the
      # workspace gate since Checkpoint 7a passed at 4be8987 would be CI-dark for at least one commit with nothing
      # saying so. Added 2026-09-17 under the maintenance rule; it stays correct after the dev edge exists. With the
      # POSITIVE CONTROL on the filter: a `cargo test` filter that matches nothing exits 0 (Halt 8 shape (g)), so the
      # named line is asserted, not the exit code alone.
      - name: rk-ports conformance bodies (AC-499 fake half, behind the feature)
        shell: bash
        run: |
          cargo clippy -p rk-ports --all-targets --features conformance
          out=$(cargo test -p rk-ports --features conformance -- port_conformance_fake_rows 2>&1); rc=$?
          printf '%s\n' "$out" | tail -5
          test "$rc" -eq 0 || { echo "FAIL: rk-ports port_conformance_fake_rows exited $rc under --features conformance"; exit 1; }
          printf '%s\n' "$out" | grep -qE '^test .*\bport_conformance_fake_rows\b.* \.\.\. ok$' \
            || { echo "FAIL: no test named port_conformance_fake_rows ran and passed -- the filter matched nothing, or the module was not compiled"; exit 1; }

      # s8b (D21-42 13b): the P6 lattice, ported to Rust as `rk_kernel::lattice`, runs over the SHIPPED pack by name.
      # A filter that matches nothing exits 0 (Halt 8 shape (g)), so the test's own `... ok` line is asserted, not the
      # exit code alone. The workspace-wide run above also runs it; this step is what says that it ran.
      # (dated 2026-09-25, s8b refuting round 4) Named for what it asserts: AC-103's zero ties and hard cycles, and
      # AC-104's family totality through lattice::p6_validate_over_the_shipped_pack, a second asserted --exact run. The
      # installed pair's AC-101/AC-102 figures are REPORTED and not thresholded (D21-47 V3). No CI step thresholds
      # AC-101 or AC-102: the registered-set kill lines are read by Checkpoint 8b section (7) over the Python golden.
      - name: P6 lattice and validate over the shipped pack (AC-103, AC-104; AC-101/AC-102 reported, V3)
        shell: bash
        run: |
          out=$(cargo test -p rk-kernel --test it -- lattice::p6_lattice_over_the_shipped_pack --exact 2>&1); rc=$?
          printf '%s\n' "$out" | tail -5
          test "$rc" -eq 0 || { echo "FAIL: the shipped-pack lattice exited $rc"; exit 1; }
          printf '%s\n' "$out" | grep -qxF 'test lattice::p6_lattice_over_the_shipped_pack ... ok' \
            || { echo "FAIL: lattice::p6_lattice_over_the_shipped_pack did not run and pass -- the filter matched nothing"; exit 1; }
          out=$(cargo test -p rk-kernel --test it -- lattice::p6_validate_over_the_shipped_pack --exact 2>&1); rc=$?
          printf '%s\n' "$out" | tail -5
          test "$rc" -eq 0 || { echo "FAIL: the shipped-pack validate exited $rc"; exit 1; }
          printf '%s\n' "$out" | grep -qxF 'test lattice::p6_validate_over_the_shipped_pack ... ok' \
            || { echo "FAIL: lattice::p6_validate_over_the_shipped_pack did not run and pass -- the filter matched nothing"; exit 1; }

      # Against the committed Cargo.lock, watching the gix-* advisory cluster specifically.
      - name: audit
        run: cargo audit --deny unmaintained

      # deny.toml: ADR-0086's bans, workspace-wide and including dev-dependencies used to smuggle
      # in a runtime; `[advisories] unmaintained = "deny"`; `[licenses]`.
      - name: deny
        run: cargo deny check bans advisories licenses

  # AC-498 -- the ONLY instrument in this repository that reaches the class a dependency-graph
  # assertion cannot see. D-2, taken 2026-09-14.
  #
  # AC-498's THEN: "the `rk-kernel` and pack-validation test suites complete with zero model
  # dispatches and zero outbound network calls, using fakes for all five ports". Verified by: "a CI
  # job with network egress denied and no adapter crates linked; a dispatch counter asserted at 0."
  #
  # Three of the four instruments are IN-TREE and run under the `test` gate above:
  # `crates/rk-kernel/tests/it/no_egress.rs`'s `ac498_no_egress_dispatch_zero` holds the dispatch
  # counter at 0 with a control that proves it moves, the no-adapter walk (AC-484's own reader,
  # re-used), and the no-networking-crate walk. THIS JOB IS THE FOURTH, and it is not redundant with
  # them: a resolved-graph reading cannot see `std::net::TcpStream`, which needs no dependency and
  # enters no Cargo.lock, and `clippy.toml` carries NO network entry at all [measured 2026-09-14:
  # `grep -niE 'net|tcp|socket|reqwest|hyper|ureq|curl' clippy.toml deny.toml` -> 0 lines], so
  # AC-003's network half is enforced by nothing else. A denied container fails the `connect`
  # itself, which is the only place that class is observable.
  #
  # NO MARKETPLACE ACTION beyond `actions/checkout`, which the two jobs above already use. `docker`
  # is preinstalled on `ubuntu-latest` and `--network none` is a Docker primitive, so this adds no
  # supply-chain surface to a repository gated on `cargo-audit` and `cargo-deny` (D-2).
  #
  # 🛑 WHY THE DENIAL IS ON THE `docker run` AND NOT ON A JOB-LEVEL `container:`, WHICH IS THE FORM
  # D-2 WROTE. The literal form --
  #
  #     no-egress:
  #       container: { image: rust:1.98.1, options: --network none }
  #       steps: [checkout, cargo test]
  #
  # -- cannot work, and the reason is NOT the cargo cache. EVERY step of a container job runs INSIDE
  # that container, `actions/checkout` included, and checkout fetches the repository over the
  # network from github.com. With `--network none` the job has no source tree to test. That is
  # fatal before a single cargo invocation.
  #
  # The second reason stands behind it and is measured on this tree: `Cargo.lock` resolves 218
  # registry packages, there is no `vendor/` directory and no `.cargo/config.toml`, so a fresh
  # `rust:1.98.1` container's empty `CARGO_HOME` must fetch the index and 218 `.crate` files before
  # anything compiles. `cargo test` in a network-less container with a cold cache fails at
  # dependency resolution, not at a socket a test opened.
  #
  # So the job is structured to make the DENIAL LAND ON THE PROCESS UNDER TEST, which is what the
  # criterion is about, rather than on the plumbing that hands it its inputs: checkout and the fetch
  # run on the networked host, and the suites run in the pinned image with `--network none`. The
  # cargo home and the rustup directory are carried between the two runs in named volumes (a named
  # volume is seeded from the image on first use, so `cargo` and the pinned toolchain are still the
  # image's). Nothing in the tested step may reach the network, and that is the property asserted.
  #
  # ARMED, NOT DISCHARGED, and recorded as such: PROGRESS.md:330 records that this workflow is
  # authored and has never run. `ac498_no_egress_dispatch_zero` asserts this job is PRESENT; that it
  # has PASSED is claimed nowhere.
  no-egress:
    name: no egress (AC-498)
    runs-on: ubuntu-latest
    env:
      # The pin, and the THIRD copy of it is deliberate and bounded: a container image tag is not a
      # rustup channel, so `rust-toolchain.toml` cannot be read by `docker run`. It is asserted
      # against the pin below rather than trusted, so a bump that moves rust-toolchain.toml and
      # forgets this line fails HERE instead of silently testing a different compiler.
      IMAGE: rust:1.98.1
      CARGO_VOLUME: rk-egress-cargo
      RUSTUP_VOLUME: rk-egress-rustup
    steps:
      - uses: actions/checkout@v4
        # s8b (D21-47 V2): the frozen p9 tests read `spikes/p9` at P9_PIN from the object store, and a depth-1
        # clone holds no such commit. Whole history, so the pin is present; the helper refuses by name otherwise.
        with:
          fetch-depth: 0

      - name: the image tag matches rust-toolchain.toml's pin
        run: |
          pinned=$(grep -E '^channel *= *"' rust-toolchain.toml | sed -E 's/.*"([^"]+)".*/\1/')
          test -n "$pinned" || { echo "FAIL: no channel in rust-toolchain.toml"; exit 1; }
          test "$IMAGE" = "rust:${pinned}" \
            || { echo "FAIL: this job runs $IMAGE while rust-toolchain.toml pins $pinned"; exit 1; }
          echo "pin: $pinned; image: $IMAGE"

      # WITH NETWORK, and nothing is tested here. This step exists only so the denied step below has
      # a populated cargo home; if it fetched nothing the next step would fail on resolution and the
      # egress property would never be exercised.
      - name: warm the pinned image's caches (network ON -- no assertion is made in this step)
        run: |
          docker run --rm \
            -v "$CARGO_VOLUME":/usr/local/cargo -v "$RUSTUP_VOLUME":/usr/local/rustup \
            -v "$PWD":/w -w /w "$IMAGE" \
            sh -c 'rustup show && cargo fetch --locked'

      # THE JOB. `--network none` gives the container no interface but loopback, so any outbound
      # call -- through a crate or straight out of `std` -- fails inside the test that made it.
      # `CARGO_NET_OFFLINE=true` is belt and braces: it makes cargo REFUSE to reach for the network
      # rather than block on a socket that will never connect, and it is inherited by the child
      # `cargo metadata` / `cargo tree` invocations AC-484's and AC-498's tests spawn.
      - name: the kernel suite, with egress DENIED
        run: |
          docker run --rm --network none \
            -e CARGO_NET_OFFLINE=true -e CARGO_TERM_COLOR=always \
            -v "$CARGO_VOLUME":/usr/local/cargo -v "$RUSTUP_VOLUME":/usr/local/rustup \
            -v "$PWD":/w -w /w "$IMAGE" \
            cargo test --offline -p rk-kernel

      # The pack-validation half, named separately because AC-498 names it separately -- and with
      # the POSITIVE CONTROL on the filter itself. A `cargo test` filter that matches nothing exits
      # 0 (Halt 8 shape (g)), so the count is checked before the run rather than after.
      - name: the pack-validation suite, with egress DENIED
        run: |
          run_denied() {
            docker run --rm --network none \
              -e CARGO_NET_OFFLINE=true -e CARGO_TERM_COLOR=always \
              -v "$CARGO_VOLUME":/usr/local/cargo -v "$RUSTUP_VOLUME":/usr/local/rustup \
              -v "$PWD":/w -w /w "$IMAGE" "$@"
          }
          n=$(run_denied cargo test --offline -p rk-kernel --test it -- --list pack_validation:: \
              | grep -c ': test$' || true)
          test "${n:-0}" -ge 1 \
            || { echo "FAIL: the pack-validation filter selects 0 tests -- this step would pass over nothing"; exit 1; }
          echo "the pack-validation filter selects $n tests"
          run_denied cargo test --offline -p rk-kernel --test it -- pack_validation::

  structural:
    name: structural assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # AC-465 — the corpus-residency lint. Enforceable for the FIRST TIME as of Step 2: before the
      # redkiln-corpus split this criterion was violated by construction. No frozen tree, no E3
      # fixture, no spike JSONL is tracked in the product repo; the only reference is the pinned SHA
      # in CORPUS_PIN. One deliberate exemption, asserted by name rather than by silence.
      - name: corpus residency (AC-465)
        run: |
          test -f CORPUS_PIN || { echo "FAIL: CORPUS_PIN absent"; exit 1; }
          # The pin-manifest ALLOWLIST (AC-465's instrument names one), asserted by NAME rather than by silence.
          # Added 2026-09-17 at Step 7c's stage-open (runbook s7c §7c.17, RT-23 -- a routing; a dated amendment to
          # AC-465 naming what the allowlist may hold is OWED):
          #   (a) crates/rk-adapter-claude/tests/fixtures/recorded/*.jsonl -- the EXTRACTED corpus rows the adapter
          #       tests read (single frames/lines copied out of results/*.jsonl at CORPUS_SHA, each with bytes +
          #       sha256 in the sibling PROVENANCE.md), never a results file whole;
          #   (b) rk-kernel's three tracked *.jsonl -- 7b's and 7b-ii's debt, named here as such and NOT folded into
          #       7c's rows: they pre-date this allowlist and collided with the pathspec while CI had never run.
          #   (c) crates/rk-cli/tests/fixtures/explain/<name>/events.jsonl -- the four run-record fixtures
          #       `explain` reads (Step 7d Slice 3 cycle 9). SYNTHETIC 7d fixtures, no corpus provenance: every
          #       digest in them is a sha256 over a label naming what it stands for, and none is copied from a
          #       recorded run. Anchored `[^/]+` on the one variable segment so Slice 4's `unread/` and
          #       `doctor/` rows are not allowlisted silently by this entry.
          #   (d) crates/rk-cli/tests/fixtures/exit/<name>/*.jsonl -- the synthetic Claude-stream transcripts
          #       AC-438's BINARY arm replays through the fixture child (Step 7d Slice 3 cycle 10), reaching
          #       rows 10, 11 (x2) and 18 now that `ReplayError::NotCommitted` carries the terminal class.
          #       SYNTHETIC 7d fixtures, no corpus provenance: authored against `classify.rs`'s numbered
          #       order and modelled on rk-adapter-claude's own *.scripted.ndjson shapes, never copied from
          #       its recorded/ directory. Two `[^/]+` segments, never `.*`, for the same reason as (c).
          #   (e)-(h) added 2026-10-03 (CI's first run of this job flagged them; the dated AC-465 amendment naming
          #       them is OWED with (a)-(d)'s). Each is a SYNTHETIC rk-cli fixture by its own README, no corpus byte:
          #   (e) crates/rk-cli/tests/fixtures/cost/<case>/rows.jsonl and cost/run-frames.jsonl -- `redkiln cost`'s
          #       fixture corpus (ADR-0163 decision 6); cost/README.md: "every row here is SYNTHETIC". run-frames
          #       copies its frames from exit/schema-invalid-structured-output, itself allowlisted synthetic (d).
          #   (f) crates/rk-cli/tests/fixtures/doctor/<code>/events.jsonl -- doctor/README.md §Provenance: "No corpus
          #       byte enters the tree ... Every file here is hand-authored for Step 7d Slice 4".
          #   (g) crates/rk-cli/tests/fixtures/unread/*.jsonl -- unread/README.md: "SYNTHETIC. No corpus byte enters
          #       the tree"; hand-authored 2026-09-21 for Step 7d Slice 4 cycle 8.
          #   (h) crates/rk-cli/tests/fixtures/pack-min/lane/implement-frames.jsonl and slice/approved/frames.jsonl --
          #       pack-min/README.md: "No byte of this directory comes from the pinned corpus"; both are two-frame
          #       synthetic transcripts (session_id `synthetic-lane` / `synthetic-review`).
          #   One `[^/]+` segment at most per entry, never `.*`, for the same reason as (c).
          bad=$(git ls-files 'spikes/corpus/*' 'spikes/results/*' 'spikes/runner/*' '*.jsonl' \
                 | grep -v '^spikes/results/instrument-checks/RUNBOOK-instrument.txt$' \
                 | grep -vE '^crates/rk-adapter-claude/tests/fixtures/recorded/[^/]+\.jsonl$' \
                 | grep -vE '^crates/rk-kernel/tests/fixtures/(findings/ac282_f20_golden_transcript|logs/implement-bf1d8cec3b22d288/events|retry/api-retry-rows)\.jsonl$' \
                 | grep -vE '^crates/rk-cli/tests/fixtures/explain/[^/]+/events\.jsonl$' \
                 | grep -vE '^crates/rk-cli/tests/fixtures/exit/[^/]+/[^/]+\.jsonl$' \
                 | grep -vE '^crates/rk-cli/tests/fixtures/cost/([^/]+/rows|run-frames)\.jsonl$' \
                 | grep -vE '^crates/rk-cli/tests/fixtures/doctor/[^/]+/events\.jsonl$' \
                 | grep -vE '^crates/rk-cli/tests/fixtures/unread/[^/]+\.jsonl$' \
                 | grep -vE '^crates/rk-cli/tests/fixtures/(pack-min/lane/implement-frames|slice/approved/frames)\.jsonl$' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: corpus artifacts tracked in the product repo (ADR-0013, AC-465):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "AC-465: no corpus artifact is tracked here"
          git ls-files spikes/results/instrument-checks/RUNBOOK-instrument.txt \
            | grep -q . || { echo "FAIL: the instrument record must STAY tracked (Halt 2, PIA-019)"; exit 1; }
          echo "AC-465: the one deliberate exemption is present and tracked"

      # AC-362 — absent must never read as a measured zero. F3 measured the TTL-split fields absent
      # from `usage`; a `Some(0)` on a genuinely absent field would make a TTL claim look verified.
      #
      # ARMED, NOT DISCHARGED, and recorded as such: `rk-adapter-claude` does not exist until Step
      # 7c, so this grep matches nothing today and passes vacuously. It is here from the first
      # commit so the rule is in force BEFORE the code it governs exists — not as evidence that the
      # criterion is met.
      - name: usage fields are not laundered (AC-362 — armed, vacuous until 7c)
        run: |
          # Pathspec narrowed 2026-09-17 (Step 7c stage-open, runbook s7c §7c.1 RT-13): `crates/rk-adapter-claude/*`
          # -> `crates/rk-adapter-claude/src/*`, so the committed POSITIVE CONTROL under that crate's
          # tests/fixtures/lint-controls/ (the file that carries the banned token on purpose) is not read as a
          # violation. The register scopes AC-362 to the usage struct's call sites, which live in src/.
          # Comment-filtered as of 2026-09-18 (Step 7c Slice 5): the rule is about CALL SITES, and this
          # workspace's house style names a banned spelling in the module header that explains the ban --
          # an unfiltered grep fires on the prose describing it (Halt 7's shape; the AC-529 rule beside
          # this one learned it on 2026-09-13). Anchored on the `path:line:content` prefix grep prints.
          hits=$(git grep -nE 'unwrap_or\(0\)|unwrap_or_default\(\)' -- \
                 'crates/rk-adapter-claude/src/*' 'crates/*/src/usage.rs' \
                 | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' || true)
          if [ -n "$hits" ]; then
            echo "FAIL: absent is being read as zero on the usage struct (AC-362):"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "AC-362: no unwrap_or(0)/unwrap_or_default() on the usage struct's fields"

      # design §9.1's anyhow convention, as a check rather than a phrase. `anyhow` is confined to
      # `rk-cli` and `redkiln-migrate` (ADR-0102 decision 6).
      #
      # AMENDED 2026-09-21 (Step 7d Slice 5). This comment read "neither exists before Step 7d, so
      # the expected result today is an empty list" -- true when it was written and FALSE now: both
      # crates exist and both take anyhow, so the allowed set below is exercised rather than vacuous
      # for the first time. The rule itself is unchanged; only its stated expectation was stale.
      - name: anyhow is confined to the binary crates (design §9.1)
        run: |
          cargo metadata --format-version 1 --no-deps > /tmp/meta.json
          python3 - <<'PY'
          import json, sys
          m = json.load(open('/tmp/meta.json'))
          allowed = {'rk-cli', 'redkiln-migrate'}
          bad = sorted(p['name'] for p in m['packages']
                       if any(d['name'] == 'anyhow' for d in p['dependencies'])
                       and p['name'] not in allowed)
          print('members depending on anyhow outside the allowed set:', bad)
          sys.exit(1 if bad else 0)
          PY

      # AC-441's build-graph half and AC-466 -- the migrator is reachable only as its own binary.
      # ADDED 2026-09-21 (Step 7d Slice 5, s7d §7d.15), in the slice whose crate makes it
      # non-vacuous. Its in-process twin is
      # `ac466_ac441_migrate_depends_on_no_harness_adapter_or_ports`; the two are deliberately
      # independent instruments over the same fact.
      - name: the migrator is reachable only as its own binary (AC-441, AC-466)
        run: |
          cargo metadata --format-version 1 --no-deps > /tmp/meta-migrate.json
          python3 - <<'PY'
          import json, sys
          m = json.load(open('/tmp/meta-migrate.json'))
          # --no-deps gives every WORKSPACE MEMBER with its declared dependencies, which is the whole
          # of the relevant graph: every rk-* crate and redkiln-migrate are path members. Dev edges
          # are excluded, because rk-containment IS a dev-dependency of the migrator by design
          # (terminate_pid, for the kill test) and a dev edge is not in the shipped graph.
          deps = {p['name']: {d['name'] for d in p['dependencies'] if d.get('kind') != 'dev'}
                  for p in m['packages']}
          assert 'redkiln-migrate' in deps, 'cargo metadata does not know redkiln-migrate'

          closure, stack = set(), ['redkiln-migrate']
          while stack:
              for dep in deps.get(stack.pop(), ()):
                  if dep not in closure:
                      closure.add(dep)
                      stack.append(dep)

          # THE CONTROL, before the ban: a walk that reached nothing reports a clean closure.
          assert {'rk-types', 'rk-git'} <= closure, ('the walk reached nothing', sorted(closure))

          bad = sorted(c for c in closure
                       if c.startswith('rk-adapter-') or c in {'rk-ports', 'rk-kernel'})
          assert not bad, ('redkiln-migrate reaches a harness adapter, rk-ports or rk-kernel', bad)

          rev = sorted(n for n, d in deps.items()
                       if n.startswith('rk-') and 'redkiln-migrate' in d)
          assert not rev, ('an rk-* crate depends on redkiln-migrate', rev)

          yaml = sorted(n for n, d in deps.items() if 'yaml_serde' in d or 'serde_yaml' in d)
          assert yaml == ['redkiln-migrate'], ('the YAML dependency set (ADR-0100 d1)', yaml)

          print('AC-441/AC-466: closure clean, no reverse edge, YAML set', yaml)
          PY

      # AC-442 -- the legacy-format provenance lint. Every site that reads or writes an old redkiln
      # file format is inside the migrator, and a legacy-format handling site anywhere else fails the
      # build. ADDED 2026-09-21 (Step 7d Slice 5, s7d §7d.15). Its in-process twins are
      # `ac442_legacy_readers_only_under_legacy_module` (the ban) and
      # `ac442_lint_flags_legacy_reader_outside_legacy_module` (the two must-fail instruments).
      - name: legacy formats are read only inside the migrator (AC-442)
        run: |
          # src/ ONLY, never tests/: rk-cli's lint-controls/ac442_template_sig_control.rs carries
          # `template_sig` by design, and redkiln-migrate's own tests/it/ names both literals in
          # order to assert their absence. A scan over all of crates/ is RED on a correct tree.
          #
          # The allowlist is ONE directory, and that is a departure worth stating. §7d.11 and §7d.15
          # both say "one crate plus one named site -- rk-store's old-layout detector (AC-440's
          # predicate)". MEASURED 2026-09-21: no such site exists. AC-440 is one of the
          # corpus-bound migration ids (§7d.18), and `grep -rn bklg crates/rk-store/src` and
          # `grep -rn AC-440 crates/*/src` are both EMPTY. A row allowlisting a path that does not
          # exist would pre-approve that file before anyone read it, so the row is deliberately NOT
          # added: this rule is expected to go RED when the detector lands, and a red that makes
          # someone add the row deliberately is the loud failure, not the silent one. RAISED in the
          # slice body rather than resolved here.
          bad=$(git ls-files 'crates/*/src/*.rs' 'crates/*/src/**/*.rs' \
                | xargs grep -nE 'template_sig|rendered_sig|yaml_serde|processes/[^"]*\.ya?ml' \
                | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|/\*|\*)' \
                | grep -vE '^crates/redkiln-migrate/src/legacy(\.rs|/)' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: a legacy-format site outside crates/redkiln-migrate/src/legacy/ (AC-442):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "AC-442: every legacy-format site is inside the migrator's legacy module"

          # THE POSITIVE CONTROL, through the ban's OWN pattern: an absence asserted by a scanner
          # that has never been seen to find anything is not an assertion (Halt 8 shape (g)).
          ctl=crates/rk-cli/tests/fixtures/lint-controls/ac442_template_sig_control.rs
          test -f "$ctl" || { echo "FAIL: $ctl absent -- the ban above asserts nothing"; exit 1; }
          n=$(grep -cE 'template_sig|rendered_sig|yaml_serde|processes/[^"]*\.ya?ml' "$ctl" | tr -d '[:space:]')
          test "${n:-0}" -ge 1 || { echo "FAIL: $ctl carries no line matching the ban's own pattern"; exit 1; }
          echo "AC-442: the positive control fires"

          # AND THE ALLOWLIST IS NOT VACUOUS: the excluded module must actually read the formats, or
          # the exclusion excludes nothing and the ban is satisfied by an empty scope.
          n=$(git ls-files 'crates/redkiln-migrate/src/legacy/*.rs' \
              | xargs grep -hE 'template_sig|rendered_sig|yaml_serde' | grep -c . | tr -d '[:space:]')
          test "${n:-0}" -ge 1 || { echo "FAIL: the allowlisted legacy module names no legacy format -- the exclusion excludes nothing"; exit 1; }
          echo "AC-442: the allowlist is not vacuous"

      # ADR-0077:70 and ADR-0105 clause 5 -- git shells out through EXACTLY ONE wrapper type.
      # Step 5's structural-assertions table assigned this grep to Checkpoint 6; it landed at
      # Step 6.2. It is scoped with `git ls-files`, not `crates/`, so tests/fixtures/* -- which ARE
      # workspace members -- are in scope too, and the exclusion is ANCHORED, so a comment
      # elsewhere that merely names the wrapper's path cannot silently exempt a file.
      - name: git shells out through one wrapper only (ADR-0105 clause 5)
        run: |
          wrapper='crates/rk-git/src/git_exec.rs'
          test -s "$wrapper" || { echo "FAIL: $wrapper is absent -- this grep would be vacuous"; exit 1; }
          # The trailing `grep -vE` drops COMMENT lines, and it is here because this assertion was
          # RUN rather than trusted: rk-git/src/lib.rs quotes ADR-0077's rule verbatim in its
          # module header, and the unfiltered grep flagged that quotation as a violation. The rule
          # is about INVOCATIONS; prose stating the rule is not one (golden constraint 9 — a guard
          # scoped too wide refuses valid work).
          # Scoped to PRODUCTION code, and narrowed to its warrant on 2026-09-13 with the operator's
          # decision recorded (s6 §6.2's note). ADR-0077:70 forbids "std::process::Command FOR GIT"
          # anywhere but the wrapper; ADR-0105 clause 5 enumerates the GIT write set. Neither forbids
          # a non-git child process, and the wider form blocked AC-181, whose GIVEN is literally two
          # redkiln PROCESSES and whose instrument is also R-SQLITE's empirical half. The git rule
          # below is unweakened and stays workspace-wide, tests included.
          #
          # Narrowed AGAIN on 2026-09-17 (Step 7c's stage-open commit, runbook s7c). The token grep
          # that stood here (`std::process::Command|tokio::process::Command` over every crate's
          # src/) was both over-wide and evadable: it fired on ANY qualified spelling in the three
          # spawning adapters 7c builds (whose children are `claude`, `cargo` and `vitest`, not
          # git), and a `use std::process::{Command, Stdio};` never carried the token at all. The
          # real instrument for "no Command outside a warranted site" is clippy.toml's
          # `disallowed-types` row, which every site answers with a per-site
          # `#[expect(clippy::disallowed_types, reason = ...)]` (house form:
          # crates/rk-git/src/git_exec.rs). What THIS step keeps is exactly ADR-0077:70's stated
          # warrant -- git -- as the `Command::new("git")` check below, and the positive half after it.
          # 2026-09-17 (Step 7c stage-open, s7c §7c.1 RT-13): the anchored lint-controls exclusion. The adapters'
          # committed positive controls (crates/<crate>/tests/fixtures/lint-controls/*.rs) carry banned tokens on
          # purpose -- they are the bans' instruments, not violations. Anchored on the path prefix grep prints.
          # (dated 2026-09-30, s8g build, package CI-AC403-8g; D21-128; Weigh-In wi-b248cd, decision C.) The comment
          # filter the paragraph above describes was NOT in this pipeline: at 89eb1fb it read 4, and all 4 were comment
          # lines naming the token (D21-128's "Measured and not disposed of"). Restored as the last filter, the same
          # regex as Checkpoint 6's git line (s6), byte for byte.
          bad=$(git ls-files '*.rs' | xargs grep -n 'Command::new("git")' | grep -vE "^${wrapper}:" \
                | grep -vE '^crates/[^/]+/tests/fixtures/lint-controls/' \
                | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: Command::new(\"git\") outside the wrapper:"
            printf '%s\n' "$bad"
            exit 1
          fi
          # The POSITIVE half. The check above (two, until 2026-09-17) passes on a workspace with no git exec at all --
          # Halt 8 shape (g), a pass condition that is the absence of output. This asserts the
          # wrapper really does invoke git, so the bans above are guarding something.
          n=$(grep -c 'Command::new("git")' "$wrapper")
          test "${n:-0}" -ge 1 || { echo "FAIL: the wrapper does not invoke git; the ban greps assert nothing"; exit 1; }
          echo "ADR-0105 clause 5: one wrapper, and it is not empty"

      # AC-529 -- the run-owned worktree is resolved from the STORE, never from the process cwd.
      # A cwd-based resolution passes the refusal test and the positive control by accident,
      # because on the happy path the two are the same directory. This is the structural half.
      #
      # Scope (2026-09-18, C-01 D-18 -- recorded before rk-cli exists so nobody widens the exemption):
      # the ban is about library and tier-1 code paths -- a WRITE resolving the run-owned worktree
      # (AC-529, ADR-0105 clause 8). It is not a licence for a mandatory `--repo`: `rk-cli`'s verbs
      # discover the working-tree root from the INHERITED cwd through the rk-git wrapper (one `rev-parse
      # --show-toplevel` via GitExec with "." as the path — s7d H-3), then take the common dir off that
      # absolute root through rk-adapter-sqlite's `path::common_dir` (7c's shipped reader; rk-cli issues no
      # `rev-parse --git-common-dir` of its own), never `std::env::current_dir`, with an
      # optional `-C <path>`. That path satisfies this grep unchanged. The rule itself is not changed.
      - name: the run-owned worktree is not resolved from cwd (AC-529)
        run: |
          # Two corrections, both found by RUNNING this rule rather than trusting it (2026-09-13):
          #
          # 1. The comment filter was `grep -vE '^\s*//'`, which can never match: grep prints
          #    `path:line:content`, so the line starts with the PATH. The anchored form below is
          #    the one that works. rk-git/src/worktree.rs states this very rule in its module
          #    header, and the broken filter flagged it -- the FIFTH assertion in Step 6 to trip on
          #    prose naming the thing it governs.
          # 2. `git ls-files` lists only TRACKED files, so this rule passes vacuously over new code
          #    that has not been committed yet -- precisely when it is most wanted. CI always runs
          #    on committed code so it is sound here; run it locally only AFTER `git add`.
          bad=$(git ls-files 'crates/*/src/*.rs' 'crates/*/src/**/*.rs' \
                | xargs grep -n 'env::current_dir' \
                | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: a crate reads the current directory (AC-529, ADR-0105 clause 8):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "AC-529: no src/ path reads the current directory"

      # design:1783 names three of Step 7a's assertions as CI's, by id: the `rk-ports` count
      # assertion `traits.len() == fakes.len()` (AC-481), the port-inventory lint with a denylist on
      # the git surface (AC-483), and "no `async fn` and no future-returning method in any
      # `rk-ports` trait" (AC-528).
      #
      # ARMED, NOT DISCHARGED, and recorded as such: PROGRESS.md:330 records that this workflow is
      # authored and has never run, so a row added here is armed and nothing more.
      #
      # Each rule is COMMENT-FILTERED and ANCHORED, and carries the TRACKED-FILE POSITIVE CONTROL.
      # All three properties were paid for: `grep -vE '^\s*//'` can never match, because grep prints
      # `path:line:content` and the line starts with the PATH (ci.yml:186-190 records it as the form
      # that does not work); this workspace's house pattern is a module header naming the governing
      # record, so an unfiltered rule halts on a CORRECT crate; and a pass condition that is the
      # ABSENCE of output exits 0 over a tree that is not there (Halt 8 shape (g)), which is what
      # the file-count control below closes.
      - name: the rk-ports port inventory (AC-481, AC-483, AC-528 — armed, never yet run)
        run: |
          files=$(git ls-files 'crates/rk-ports/src/*.rs' 'crates/rk-ports/src/**/*.rs')
          test -n "$files" || { echo "FAIL: no TRACKED .rs files under crates/rk-ports/src -- every rule below would be vacuous"; exit 1; }

          # AC-481. The assertion must EXIST and be spelled as design:1783 names it: the idiomatic
          # `assert_eq!(traits.len(), fakes.len())` does not contain this string. Whether it RAN is
          # the `cargo test` gate's job, not this one's.
          grep -rq 'traits.len() == fakes.len()' crates/rk-ports/ \
            || { echo "FAIL: rk-ports carries no AC-481 parity assertion spelled 'traits.len() == fakes.len()'"; exit 1; }
          echo "AC-481: the parity assertion is present"

          # AC-483. Git is deliberately not a port (ADR-0003:44, :57-58); GitOps is a struct inside
          # rk-git (ADR-0105 clause 1). The denylist is the register's own enumeration at :6957.
          bad=$(printf '%s\n' "$files" | xargs grep -HnE '^pub trait [A-Za-z]*(Git|Trailer|Worktree|Clone|Reconcile)' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: a port trait names the git surface (AC-483):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "AC-483: no port trait abstracts git"

          # AC-528. The alternation is as wide as the register's, which names BoxFuture too
          # (:7159-7160); only the comment exclusion narrows, and that is ADR-0076's own scope --
          # the rule is about DECLARATIONS, and rk-ports' module header explains why the ports are
          # sync. `-H` is load-bearing: grep prints the path prefix only when given more than one
          # file, so on a single-file crate the two-colon filter would match nothing.
          bad=$(printf '%s\n' "$files" | xargs grep -HnE 'async fn|impl Future|-> .*Future|BoxFuture' \
                | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
          if [ -n "$bad" ]; then
            echo "FAIL: an async fn or future-returning method in a port trait (AC-528, ADR-0076):"
            printf '%s\n' "$bad"
            exit 1
          fi
          echo "AC-528: no port trait declares an async or future-returning method"

          # THE POSITIVE CONTROL for the two denylists above: both pass over a crate with no port
          # traits at all. This asserts the five are there to be guarded.
          n=$(printf '%s\n' "$files" | xargs grep -hE '^pub trait [A-Za-z][A-Za-z0-9_]*: Send \+ Sync' | grep -c . | tr -d '[:space:]')
          test "${n:-0}" -eq 5 || { echo "FAIL: ${n:-0} port traits declare Send + Sync, expected 5 (ADR-0003:34) -- the denylists above assert nothing"; exit 1; }
          echo "AC-480/AC-481: five port traits, Send + Sync on all five"
